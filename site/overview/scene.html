<!doctype html><meta charset="utf-8"><title>SuiFleet motion overview</title>
<style>@font-face{font-family:Inter;src:url('/site/src/assets/inter-variable.woff2')}body{margin:0;background:#07182e}canvas{display:block}</style><canvas id="scene"></canvas>
<script>
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d');
const logo=new Image();logo.src='/site/src/assets/logo.svg';
window.ready=Promise.all([document.fonts.load('600 32px Inter'),logo.decode()]);
const B='#62baff',G='#81ebc4',W='#f4f8ff',M='#a1b9d4',D='#0c2541';
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=clamp(x);return 1-(1-x)**3},lerp=(a,b,t)=>a+(b-a)*t;
function label(s,x,y,size=24,color=W,align='center'){
 c.fillStyle=color;c.font=`600 ${size}px Inter`;c.textAlign=align;c.fillText(s,x,y);
 if(window.renderedLabels){const m=c.measureText(s),matrix=c.getTransform();const corners=[[x-m.actualBoundingBoxLeft,y-m.actualBoundingBoxAscent],[x+m.actualBoundingBoxRight,y-m.actualBoundingBoxAscent],[x-m.actualBoundingBoxLeft,y+m.actualBoundingBoxDescent],[x+m.actualBoundingBoxRight,y+m.actualBoundingBoxDescent]].map(p=>matrix.transformPoint({x:p[0],y:p[1]}));window.renderedLabels.push({text:s,left:Math.min(...corners.map(p=>p.x)),right:Math.max(...corners.map(p=>p.x)),top:Math.min(...corners.map(p=>p.y)),bottom:Math.max(...corners.map(p=>p.y))})}
}
function box(x,y,w,h,color=D,r=20){c.beginPath();c.roundRect(x-w/2,y-h/2,w,h,r);c.fillStyle=color;c.fill();c.strokeStyle='#31516f';c.lineWidth=1.5;c.stroke()}
function line(a,b,color=B,width=3){c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(...a);c.lineTo(...b);c.stroke()}
function check(x,y,t,size=24){c.strokeStyle=G;c.lineWidth=5;c.lineCap='round';const p=[[-.6,0],[-.15,.45],[.65,-.5]],a=p[0],b=p[1],d=p[2];c.beginPath();c.moveTo(x+a[0]*size,y+a[1]*size);const q=clamp(t*2);c.lineTo(x+lerp(a[0],b[0],q)*size,y+lerp(a[1],b[1],q)*size);if(t>.5)c.lineTo(x+lerp(b[0],d[0],(t-.5)*2)*size,y+lerp(b[1],d[1],(t-.5)*2)*size);c.stroke()}
function device(x,y,s=1,name='',phase=0){c.save();c.translate(x,y);c.scale(s,s);box(0,0,94,126,'#102f4d',14);box(0,-10,66,72,'#071a30',5);c.fillStyle=phase>0?G:B;c.beginPath();c.arc(0,46,4,0,7);c.fill();if(phase>0)check(0,-10,1,20);else{c.strokeStyle=B;c.lineWidth=3;c.beginPath();c.arc(0,-10,17,phase,phase+4.3);c.stroke()}if(name)label(name,0,93,17);c.restore()}
function records(x,y,s=1){c.save();c.translate(x,y);c.scale(s,s);for(let i=0;i<3;i++){box(0,-40+i*40,118,31,'#123b5c',8);c.fillStyle=B;c.beginPath();c.arc(-42,-40+i*40,4,0,7);c.fill();line([-25,-40+i*40],[43,-40+i*40],'#467599',2)}c.restore()}
function file(x,y,s=1,locked=false){c.save();c.translate(x,y);c.scale(s,s);box(0,0,60,76,'#174b70',9);for(let i=0;i<3;i++)line([-16,-18+i*15],[16,-18+i*15],B,3);if(locked){box(18,18,28,25,'#164d46',5);c.strokeStyle=G;c.lineWidth=3;c.beginPath();c.arc(18,4,9,Math.PI,0);c.stroke()}c.restore()}
function store(x,y,s=1){c.save();c.translate(x,y);c.scale(s,s);for(let i=0;i<3;i++)box(0,-30+i*32,115,26,'#17435d',7);c.restore()}
function wallet(x,y,s=1){c.save();c.translate(x,y);c.scale(s,s);box(0,0,135,88,'#133e61',15);box(44,0,65,36,'#1c5a80',8);c.fillStyle=G;c.beginPath();c.arc(32,0,5,0,7);c.fill();c.restore()}
function consoleIcon(x,y,s=1){c.save();c.translate(x,y);c.scale(s,s);box(0,-8,150,95,'#123650',10);box(0,-10,127,70,'#071a30',4);line([-30,53],[30,53],M,5);line([0,40],[0,52],M,5);line([-45,-25],[17,-25],B,4);line([-45,-9],[43,-9],G,3);line([-45,7],[27,7],M,3);c.restore()}
// Only participating components are drawn. There is no detached corner legend.
function layout(width,height){return {portrait:height>width,action:[width/2,height>width?230:185],stage:[width/2,height>width?700:425],scale:height>width?1:1.18}}
const chapters={
 fleet:{caption:'Start with one. Organize many.'},approve:{caption:'Your approval authorizes the change'},
 publish:{caption:'Release details + software files'},poll:{caption:'Devices initiate their own checks'},
 install:{caption:'Download. Verify. Run your installer.'},report:{caption:'Installation results and health are separate'},
 overview:{caption:'One release. A whole fleet.'}
};
let vertical=1;
const point=p=>[p[0],p[1]*vertical];
function actor(id,p,draw,name,offset=85){
 const [x,y]=point(p);c.save();c.translate(x,y);draw();
 c.font='600 21px Inter';let row='',rows=[];
 for(const word of name.split(' ')){if(c.measureText((row+' '+word).trim()).width>260&&row){rows.push(row);row=word}else row+=(row?' ':'')+word}rows.push(row);
 rows.forEach((text,i)=>label(text,0,offset+i*25,21,W));
 const transform=c.getTransform();window.renderedActors[id]={x:transform.e,y:transform.f};c.restore();
}
function transfer(from,to,a,b,p,kind='file'){
 p=clamp(p);a=point(a);b=point(b);
 window.renderedTransfers.push({from,to,progress:p});
 if(p<=0)return;
 // The file travels from the source component into the receiving component.
 arrow(a,b,p,G);
 if(p<1){const x=lerp(a[0],b[0],ease(p)),y=lerp(a[1],b[1],ease(p));
  if(kind==='request'){box(x,y,55,37,'#113b54',7);label('?',x,y+9,27,B)}
  else if(kind==='result'){sheet(x,y,1,'',G);check(x,y,1,20)}
  else file(x,y,.6,false);
 }
}
// Draw a line progressively, including its final moving pen tip.
function drawPath(points,p,color=B,width=4,pen=false){
 p=clamp(p);const lengths=points.slice(1).map((b,i)=>Math.hypot(b[0]-points[i][0],b[1]-points[i][1]));
 let remaining=lengths.reduce((a,b)=>a+b,0)*p,last=points[0];
 c.beginPath();c.moveTo(...last);c.lineCap='round';c.lineJoin='round';
 for(let i=0;i<lengths.length;i++){
  const b=points[i+1],q=lengths[i]?Math.min(1,remaining/lengths[i]):1;
  last=[lerp(points[i][0],b[0],q),lerp(points[i][1],b[1],q)];c.lineTo(...last);remaining-=lengths[i];if(q<1)break;
 }
 c.strokeStyle=color;c.lineWidth=width;c.stroke();
 if(pen&&p>0&&p<1){c.save();c.translate(...last);c.rotate(-.6);c.fillStyle=W;c.beginPath();c.moveTo(0,0);c.lineTo(5,-34);c.lineTo(16,-29);c.closePath();c.fill();c.restore()}
}
function arrow(a,b,p,color=B){
 const end=[lerp(a[0],b[0],clamp(p)),lerp(a[1],b[1],clamp(p))];drawPath([a,b],p,color,3);
 if(p>.05){const angle=Math.atan2(b[1]-a[1],b[0]-a[0]);c.save();c.translate(...end);c.rotate(angle);drawPath([[-12,-6],[0,0],[-12,6]],1,color,3);c.restore()}
}
function appear(p,draw){if(p<=0)return;c.save();c.globalAlpha=clamp(p*3);const q=ease(p);c.translate(0,(1-q)*25);c.scale(.9+.1*q,.9+.1*q);draw();c.restore()}
function sheet(x,y,p,title='Release 1.2',color=B){
 c.save();c.translate(x,y);box(0,0,150,178,'#0b233a',12);
 drawPath([[-75,89],[-75,-89],[45,-89],[75,-59],[75,89],[-75,89]],p,color,4);
 if(p>.25){label(title,0,-42,20,W);for(let i=0;i<3;i++)drawPath([[-48,-10+i*22],[38-i*8,-10+i*22]],clamp((p-.25-i*.12)*4),M,3)}c.restore();
}
function packageBox(x,y,p,open=0){
 c.save();c.translate(x,y);const k=clamp(open);
 c.fillStyle='#123d57';c.beginPath();c.moveTo(-90,-20);c.lineTo(0,15);c.lineTo(90,-20);c.lineTo(90,85);c.lineTo(0,120);c.lineTo(-90,85);c.closePath();c.fill();
 drawPath([[-90,-20],[0,15],[90,-20],[90,85],[0,120],[-90,85],[-90,-20]],p,B,4);
 drawPath([[0,15],[0,120]],p,B,3);
 drawPath([[-90,-20],[-50-35*k,-65-35*k],[0,-30],[50+35*k,-65-35*k],[90,-20]],p,G,4);
 if(p>.5)label('SOFTWARE',0,68,17,W);c.restore();
}
function bigDevice(x,y,p,version='1.1',scale=1){
 c.save();c.translate(x,y);c.scale(scale,scale);
 box(0,0,130,180,'#0d2b44',16);drawPath([[-65,90],[-65,-90],[65,-90],[65,90],[-65,90]],p,B,4);
 box(0,-15,101,103,'#07182e',6);if(p>.5){label(version,0,-5,27,G);c.fillStyle=G;c.beginPath();c.arc(0,64,5,0,7);c.fill()}c.restore();
}
function lockIcon(x,y,p,opened=false){
 c.save();c.translate(x,y);box(0,15,62,54,'#163d45',9);
 const shift=opened?22:0;drawPath([[-20,-9],[-20,-33],[-10,-47],[10,-47],[20,-33],[20,-9-shift]],p,G,5);
 c.fillStyle=G;c.beginPath();c.arc(0,12,5,0,7);c.fill();line([0,16],[0,26],G,4);c.restore();
}
function magnifier(x,y,p){
 c.save();c.translate(x,y);c.fillStyle='#103650';c.beginPath();c.arc(0,0,44,0,7);c.fill();c.strokeStyle=G;c.lineWidth=5;c.beginPath();c.arc(0,0,44,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(p));c.stroke();drawPath([[31,31],[66,66]],p,G,10);c.restore();
}
function gear(x,y,t,p){
 c.save();c.translate(x,y);c.rotate(t*.7);c.globalAlpha=clamp(p*3);
 for(let i=0;i<8;i++){c.rotate(Math.PI/4);drawPath([[33,0],[48,0]],1,G,10)}
 c.strokeStyle=G;c.lineWidth=6;c.beginPath();c.arc(0,0,31,0,7);c.stroke();c.beginPath();c.arc(0,0,12,0,7);c.stroke();c.restore();
}
function stamp(x,y,p,text='APPROVED'){
 p=clamp(p);if(!p)return;c.save();c.translate(x,y);c.rotate(-.12);c.globalAlpha=clamp(p*3);const s=1+.4*(1-ease(p));c.scale(s,s);c.strokeStyle=G;c.lineWidth=4;c.strokeRect(-92,-23,184,46);label(text,0,8,23,G);c.restore();
}
function phase(t,start,length=1){return clamp((t-start)/length)}
function visualFleet(t){
 actor('console',[-220,-90],()=>{consoleIcon(0,0,1.12);drawPath([[-45,-25],[15,-25]],phase(t,0,2),G,5)},'Console',90);
 actor('sui',[220,-90],()=>{records(0,0,1.15);if(t>6){label('Workshop',0,-35,17,G);label('Field',0,10,17,G)}},'Sui · group records',90);
 transfer('console','sui',[-125,-90],[140,-90],phase(t,2,3),'file');
 actor('device',[-165,80],()=>{
  const spread=ease(phase(t,3,4));
  for(let i=0;i<6;i++){
   const p=i?phase(t,3+i*.4,1):phase(t,0,1);
   if(p){const x=(i%3-1)*95,y=i<3?-20:55;appear(p,()=>bigDevice(x*spread,y*spread,p,'',.3))}
  }
  drawPath([[-140,-65],[40,-65],[40,95],[-140,95],[-140,-65]],phase(t,7,3),G,3);
  drawPath([[55,-65],[140,-65],[140,95],[55,95],[55,-65]],phase(t,8,3),B,3);
 },t>8?'Device groups':'Your devices',110);
 if(t>10){arrow(point([135,-20]),point([-5,55]),phase(t,10,2),G);label('Groups ready for rollout',160,point([0,150])[1],22,G)}
}
function visualApprove(t){
 actor('console',[-220,-85],()=>consoleIcon(0,0,1.1),'Console',-90);
 actor('wallet',[-220,105],()=>{
  wallet(0,0,.95);if(t>10)lockIcon(45,-10,phase(t,10,1));
 },t>10?'Private key stays here':'Your wallet',80);
 actor('sui',[220,-85],()=>{records(0,0,1.15);if(t>9)check(0,0,phase(t,9,1),28)},t>9?'Sui · approval verified':'Sui · shared records',90);
 transfer('console','wallet',[-220,-35],[-220,75],phase(t,.5,2),'request');
 if(t>2){
  const [x,y]=point([-25,85]);sheet(x,y,phase(t,2,1),'Request');
  drawPath([[x-48,y+45],[x-32,y+20],[x-32,y+60],[x-5,y+35],[x+8,y+48],[x+32,y+27],[x+48,y+42]],phase(t,3,2.5),G,4,true);
  stamp(x,y+90,phase(t,5.5,1));
  line(point([-150,105]),[x-75,y+20],'#315875',2);
 }
 transfer('wallet','sui',[-100,75],[150,-60],phase(t,7,2.5),'file');
}
function visualPublish(t){
 actor('console',[-220,-85],()=>{consoleIcon(0,0,1.12);c.fillStyle='#071a30';c.fillRect(-58,-44,116,71);label('1.2',0,0,24,G)},'Console · release 1.2',-95);
 const pkg=point([-220,70]);packageBox(...pkg,phase(t,0,2),phase(t,2,2));
 line(point([-220,-15]),[pkg[0],pkg[1]-65],'#315875',2);
 actor('sui',[220,-85],()=>{records(0,0,1.15);if(t>5){c.fillStyle='#123b5c';c.fillRect(-43,-15,86,30);label('1.2',0,7,22,G)}},t>5?'Sui · release recorded':'Sui · shared records',90);
 actor('walrus',[220,105],()=>{
  store(0,0,1.25);if(t>10)file(0,-5,.65,false);if(t>12)lockIcon(45,-5,phase(t,12,1.5));
 },t>13?'Walrus · encrypted files':'Walrus · software files',90);
 transfer('console','sui',[-125,-85],[140,-85],phase(t,2,3),'file');
 transfer('console','walrus',[-125,70],[140,105],phase(t,6,4),'file');
 if(t>14){const [x,y]=point([170,35]);label('Seal checks access',x,y,22,G)}
}
function visualPoll(t){
 actor('device',[-220,75],()=>{
  bigDevice(0,0,1,'1.1',1);if(t>2&&t<6){label('?',0,-38,25,B)}
 },t>9?'Device · update available':'Device client',115);
 actor('sui',[220,-75],()=>{records(0,0,1.2);c.fillStyle='#123b5c';c.fillRect(-43,-15,86,30);label('1.2',0,7,23,G)},'Sui · approved release',95);
 transfer('device','sui',[-150,45],[145,-45],phase(t,1,3),'request');
 if(t>5)transfer('sui','device',[145,-10],[-150,80],phase(t,5,4),'file');
 if(t>9){const [x,y]=point([0,60]);sheet(x,y,phase(t,9,1),'1.2 available');line([x-75,y],point([-155,75]),G,2)}
}
function visualInstall(t){
 const download=phase(t,0,6),verify=phase(t,6,4),installed=phase(t,11,5);
 actor('walrus',[220,-65],()=>{store(0,0,1.4);file(0,-10,.65,false)},'Walrus · release files',90);
 actor('device',[-220,65],()=>{
  bigDevice(0,0,1,installed>=1?'1.2':'1.1',1.1);
  if(t<7){line([-45,25],[45,25],'#254961',7);line([-45,25],[-45+90*download,25],G,7)}
  if(t>=7&&t<11)magnifier(lerp(-35,30,verify),lerp(-30,5,verify),verify);
  if(installed>=1)check(0,-45,phase(t,16,1),16);
 },t<7?'Device · downloading':t<11?'Device · verifying':installed<1?'Device · installing':'Device · running 1.2',120);
 transfer('walrus','device',[145,-35],[-140,35],download,'file');
 if(t>6&&t<11){const [x,y]=point([-50,55]);sheet(x,y,phase(t,6,1),'Release proof');arrow(point([-135,65]),[x-75,y],verify,G)}
 if(t>=11){const [x,y]=point([-60,65]);gear(x,y,t,installed);line([x-50,y],point([-155,65]),G,3);label('Your platform installer',40,point([0,180])[1],23,G)}
}
function visualReport(t){
 actor('device',[-220,105],()=>{bigDevice(0,0,1,'1.2',.85)},'Device client',105);
 actor('sui',[220,-85],()=>{records(0,0,1.15);if(t>5)check(0,0,phase(t,5,1),25)},'Sui · device result',90);
 actor('console',[-220,-85],()=>{
  consoleIcon(0,0,1.15);if(t>7){c.fillStyle='#071a30';c.fillRect(-58,-44,116,71)}
  if(t>7&&t<11){label('Applied',0,-8,21,G);check(43,12,1,12)}
  if(t>=11){drawPath([[-52,8],[-35,8],[-23,-10],[-12,24],[2,-26],[14,8],[42,8]],phase(t,11,5),G,3)}
 },t<7?'Console':t<11?'Console · installation applied':'Console · separate health sample',90);
 transfer('device','sui',[-145,80],[145,-60],phase(t,1,4),'file');
 if(t>5)transfer('sui','console',[140,-85],[-125,-85],phase(t,5,3),'file');
 if(t>11){
  transfer('device','sui',[-145,105],[175,-25],phase(t,11,3),'file');
  transfer('sui','console',[140,-60],[-125,-60],phase(t,14,3),'file');
  const [x,y]=point([60,100]);label('Result ≠ health',x,y,26,G);
 }
}
function visualOverview(t){
 actor('console',[-220,-85],()=>{consoleIcon(0,0,1.12);wallet(65,30,.38)},'Console + wallet',90);
 actor('sui',[220,-85],()=>{records(0,0,1.15);if(t>3){c.fillStyle='#123b5c';c.fillRect(-43,-15,86,30);label('1.2',0,7,22,G)}},'Sui · shared records',90);
 actor('walrus',[220,105],()=>{store(0,0,1.2);if(t>7)file(0,-5,.6,false)},'Walrus · software files',90);
 actor('device',[-220,105],()=>{bigDevice(0,0,1,t>15?'1.2':'1.1',.8);if(t>16)check(0,-40,1,14)},'Device client',105);
 const steps=[['console','sui',[-125,-85],[140,-85]],['console','walrus',[-125,-55],[140,85]],['device','sui',[-145,70],[145,-60]],['walrus','device',[140,105],[-145,105]],['device','sui',[-145,75],[145,-55]]];
 const n=Math.min(4,Math.floor(t/4)),step=steps[n];transfer(...step,phase(t,n*4,3));
 const actions=['Approve the release','Store the software','Check for updates','Download and install','Report the result'];
 label(actions[n],0,point([0,-170])[1],25,G);
}
function centralIllustration(L,scene,t){
 c.save();c.translate(...L.stage);c.scale(L.scale,L.scale);vertical=L.portrait?1.65:1;
 ({fleet:visualFleet,approve:visualApprove,publish:visualPublish,poll:visualPoll,install:visualInstall,report:visualReport,overview:visualOverview})[scene](t);
 c.restore();
}
window.renderFrame=async function({width,height,scene,localTime,index,total}){
 await window.ready;canvas.width=width;canvas.height=height;
 const L=layout(width,height),t=localTime;
 window.renderedLabels=[];c.fillStyle='#07182e';c.fillRect(0,0,width,height);
 c.drawImage(logo,36,28,44,44);label('SuiFleet',96,59,25,W,'left');label(`${index+1} / ${total}`,width-40,57,18,M,'right');
 const size=L.portrait?38:42,max=width-85;let row='',lines=[];c.font=`600 ${size}px Inter`;
 for(const word of scene.title.split(' ')){if(c.measureText(row+' '+word).width>max&&row){lines.push(row);row=word}else row+=(row?' ':'')+word}
 lines.push(row);lines.forEach((s,i)=>label(s,width/2,(L.portrait?145:130)+i*size*1.2,size));
 label(chapters[scene.id].caption,...L.action,L.portrait?25:24,M);
 window.renderedActors={};window.renderedTransfers=[];
 centralIllustration(L,scene.id,t);
 c.fillStyle='#294765';c.fillRect(40,height-34,width-80,3);c.fillStyle=B;c.fillRect(40,height-34,(width-80)*(index+clamp(t/scene.duration))/total,3);
 return canvas.toDataURL('image/png').split(',')[1];
};
</script>
