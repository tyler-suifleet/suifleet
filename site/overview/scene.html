<!doctype html><meta charset="utf-8"><title>SuiFleet motion overview</title>
<style>@font-face{font-family:Inter;src:url('/site/src/assets/inter-variable.woff2')}body{margin:0;background:#07182e}canvas{display:block}</style><canvas id="scene"></canvas>
<script>
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d');
const logo=new Image();logo.src='/site/src/assets/logo.svg';
window.ready=Promise.all([document.fonts.load('600 32px Inter'),logo.decode()]);
const B='#62baff',G='#81ebc4',W='#f4f8ff',M='#a1b9d4',D='#0c2541';
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=clamp(x);return 1-(1-x)**3},lerp=(a,b,t)=>a+(b-a)*t;
function label(s,x,y,size=24,color=W,align='center'){c.fillStyle=color;c.font=`600 ${size}px Inter`;c.textAlign=align;c.fillText(s,x,y)}
function box(x,y,w,h,color=D,r=20){c.beginPath();c.roundRect(x-w/2,y-h/2,w,h,r);c.fillStyle=color;c.fill();c.strokeStyle='#31516f';c.lineWidth=1.5;c.stroke()}
function line(a,b,color=B,width=3){c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(...a);c.lineTo(...b);c.stroke()}
function check(x,y,t,size=24){c.strokeStyle=G;c.lineWidth=5;c.lineCap='round';const p=[[-.6,0],[-.15,.45],[.65,-.5]],a=p[0],b=p[1],d=p[2];c.beginPath();c.moveTo(x+a[0]*size,y+a[1]*size);const q=clamp(t*2);c.lineTo(x+lerp(a[0],b[0],q)*size,y+lerp(a[1],b[1],q)*size);if(t>.5)c.lineTo(x+lerp(b[0],d[0],(t-.5)*2)*size,y+lerp(b[1],d[1],(t-.5)*2)*size);c.stroke()}
function device(x,y,s=1,name='',phase=0){c.save();c.translate(x,y);c.scale(s,s);box(0,0,94,126,'#102f4d',14);box(0,-10,66,72,'#071a30',5);c.fillStyle=phase>0?G:B;c.beginPath();c.arc(0,46,4,0,7);c.fill();if(phase>0)check(0,-10,1,20);else{c.strokeStyle=B;c.lineWidth=3;c.beginPath();c.arc(0,-10,17,phase,phase+4.3);c.stroke()}if(name)label(name,0,93,17);c.restore()}
function records(x,y,s=1){c.save();c.translate(x,y);c.scale(s,s);for(let i=0;i<3;i++){box(0,-40+i*40,118,31,'#123b5c',8);c.fillStyle=B;c.beginPath();c.arc(-42,-40+i*40,4,0,7);c.fill();line([-25,-40+i*40],[43,-40+i*40],'#467599',2)}c.restore()}
function file(x,y,s=1,locked=false){c.save();c.translate(x,y);c.scale(s,s);box(0,0,60,76,'#174b70',9);for(let i=0;i<3;i++)line([-16,-18+i*15],[16,-18+i*15],B,3);if(locked){box(18,18,28,25,'#164d46',5);c.strokeStyle=G;c.lineWidth=3;c.beginPath();c.arc(18,4,9,Math.PI,0);c.stroke()}c.restore()}
function store(x,y,s=1){c.save();c.translate(x,y);c.scale(s,s);for(let i=0;i<3;i++)box(0,-30+i*32,115,26,'#17435d',7);c.restore()}
function wallet(x,y,s=1){c.save();c.translate(x,y);c.scale(s,s);box(0,0,135,88,'#133e61',15);box(44,0,65,36,'#1c5a80',8);c.fillStyle=G;c.beginPath();c.arc(32,0,5,0,7);c.fill();c.restore()}
function consoleIcon(x,y,s=1){c.save();c.translate(x,y);c.scale(s,s);box(0,-8,150,95,'#123650',10);box(0,-10,127,70,'#071a30',4);line([-30,53],[30,53],M,5);line([0,40],[0,52],M,5);line([-45,-25],[17,-25],B,4);line([-45,-9],[43,-9],G,3);line([-45,7],[27,7],M,3);c.restore()}
function ring(x,y,r,t,color=B){c.save();c.globalAlpha=(1-t)*.65;c.strokeStyle=color;c.lineWidth=3;c.beginPath();c.arc(x,y,r+55*t,0,7);c.stroke();c.restore()}
function packet(a,b,p,kind='dot',color=G){p=clamp(p);const x=lerp(a[0],b[0],p),y=lerp(a[1],b[1],p);c.save();c.shadowBlur=18;c.shadowColor=color;if(kind==='file')file(x,y,.6,true);else{box(x,y,kind==='request'?40:25,kind==='request'?18:25,color,6)}c.restore()}
function connection(a,b,t,{color=B,count=3,reverse=false,kind='dot'}={}){line(a,b,'#294e6b',2);const end=reverse?a:b,start=reverse?b:a;for(let i=0;i<count;i++)packet(start,end,(t*.21+i/count)%1,kind,color);const ang=Math.atan2(end[1]-start[1],end[0]-start[0]);c.save();c.translate(...end);c.rotate(ang);c.fillStyle=color;c.beginPath();c.moveTo(0,0);c.lineTo(-13,-6);c.lineTo(-13,6);c.fill();c.restore()}
function pill(s,x,y,color=B,w=180){box(x,y,w,42,'#0e304b',12);label(s,x,y+7,19,color)}
// The same four landmarks stay visible at the same coordinates in every chapter.
function layout(width,height){
 const portrait=height>width;
 return {portrait,cardWidth:portrait?260:300,cardHeight:portrait?210:170,
  console:[portrait?180:260,portrait?380:305],sui:[portrait?540:1020,portrait?380:305],
  device:[portrait?180:260,portrait?850:540],walrus:[portrait?540:1020,portrait?850:540],
  action:[width/2,portrait?230:185]};
}
const chapters={
 fleet:{active:['console','sui','device'],caption:'Organize devices into groups'},
 approve:{active:['console','sui'],caption:'Review and approve'},
 publish:{active:['console','sui','walrus'],caption:'Save the release, then its files'},
 poll:{active:['device','sui'],caption:'The device checks for an update'},
 install:{active:['device','walrus'],caption:'Download · verify · install'},
 report:{active:['device','sui','console'],caption:'Report the result'},
 overview:{active:['console','sui','device','walrus'],caption:'One shared system'}
};
function landmark(id,point,L,active,t,scene){
 const [x,y]=point,w=L.cardWidth,h=L.cardHeight;
 c.save();c.globalAlpha=active?1:.65;
 box(x,y,w,h,active?'#103651':'#0b2239',18);
 if(active){c.strokeStyle=B;c.lineWidth=2;c.beginPath();c.roundRect(x-w/2,y-h/2,w,h,18);c.stroke()}
 const iconY=y-(L.portrait?25:18),scale=L.portrait?.7:.6;
 if(id==='console'){
  consoleIcon(x-35,iconY,scale);wallet(x+65,iconY+5,.38);
 }else if(id==='sui')records(x,iconY,scale);
 else if(id==='walrus')store(x,iconY,scale);
 else{
  device(x,iconY,.53,'',scene==='report'?1:0);
  if(scene==='fleet'){
   device(x-82,iconY,.3,'',0);device(x+82,iconY,.3,'',0);
   ring(x,iconY,32,(t*.25)%1,G);
  }
 }
 const names={console:'Console + wallet',sui:'Sui · shared records',device:'Device client',walrus:'Walrus · software files'};
 label(names[id],x,y+h/2-23,22,W);
 c.restore();
}
function route(L,from,to,t,{color=B,kind='dot',reverse=false}={}){
 const a=L[from],b=L[to],dx=b[0]-a[0],dy=b[1]-a[1];
 // Clip the line to the card edges. Nothing crosses an icon or its label.
 const fraction=Math.min(dx?L.cardWidth/2/Math.abs(dx):Infinity,dy?L.cardHeight/2/Math.abs(dy):Infinity)+.025;
 const start=[a[0]+dx*fraction,a[1]+dy*fraction],end=[b[0]-dx*fraction,b[1]-dy*fraction];
 connection(start,end,t,{color,count:1,kind,reverse});
}
function systemScene(L,scene,t){
 const chapter=chapters[scene];
 // One flow at a time makes the moving item easy to follow.
 if(scene==='fleet')route(L,'console','sui',t,{kind:'request'});
 if(scene==='approve')route(L,'console','sui',t,{kind:'request',color:G});
 if(scene==='publish'){
  if(t<7)route(L,'console','sui',t,{kind:'request'});
  else route(L,'console','walrus',t,{kind:'file',color:G});
 }
 if(scene==='poll')route(L,'device','sui',t,{kind:t%6<3?'request':'dot',reverse:t%6>=3,color:t%6<3?B:G});
 if(scene==='install')route(L,'walrus','device',t,{kind:'file',color:G});
 if(scene==='report'){
  if(t<7)route(L,'device','sui',t,{kind:'request',color:G});
  else route(L,'sui','console',t,{color:G});
 }
 if(scene==='overview'){
  const flows=[['console','sui'],['device','sui'],['walrus','device'],['device','sui']];
  const [from,to]=flows[Math.floor(t/4)%flows.length];route(L,from,to,t,{color:G});
 }
 for(const id of ['console','sui','device','walrus'])landmark(id,L[id],L,chapter.active.includes(id),t,scene);
 let caption=chapter.caption;
 if(scene==='publish')caption=t<7?'Save release details':'Store software files';
 if(scene==='install')caption=t<8?'Download the software':t<12?'Verify the release':'Run your platform installer';
 if(scene==='report')caption=t<7?'Installation result':'View results · health is separate';
 // A fixed action label above the diagram leaves the flow paths unobstructed.
 const [x,y]=L.action;box(x,y,L.portrait?620:550,58,'#07182e',14);label(caption,x,y+8,L.portrait?26:25,G);
 if(scene==='install'){
  const p=clamp((t-2)/6),y=L.device[1]+L.cardHeight/2+20;
  box(L.device[0],y,L.cardWidth-20,8,'#183a54',4);
  c.fillStyle=G;c.fillRect(L.device[0]-(L.cardWidth-20)/2,y-3,(L.cardWidth-20)*p,6);
 }
}
window.renderFrame=async function({width,height,scene,localTime,index,total}){
 await window.ready;canvas.width=width;canvas.height=height;
 const L=layout(width,height),t=localTime;
 c.fillStyle='#07182e';c.fillRect(0,0,width,height);
 c.drawImage(logo,36,28,44,44);label('SuiFleet',96,59,25,W,'left');label(`${index+1} / ${total}`,width-40,57,18,M,'right');
 const size=L.portrait?38:42,max=width-85;let row='',lines=[];c.font=`600 ${size}px Inter`;
 for(const word of scene.title.split(' ')){if(c.measureText(row+' '+word).width>max&&row){lines.push(row);row=word}else row+=(row?' ':'')+word}
 lines.push(row);lines.forEach((s,i)=>label(s,width/2,(L.portrait?145:130)+i*size*1.2,size));
 systemScene(L,scene.id,t);
 c.fillStyle='#294765';c.fillRect(40,height-34,width-80,3);c.fillStyle=B;c.fillRect(40,height-34,(width-80)*(index+clamp(t/scene.duration))/total,3);
 window.renderedLandmarks=Object.fromEntries(['console','sui','device','walrus'].map(id=>[id,{x:L[id][0],y:L[id][1],width:L.cardWidth,height:L.cardHeight}]));
 return canvas.toDataURL('image/png').split(',')[1];
};
</script>
