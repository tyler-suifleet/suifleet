<!doctype html><meta charset="utf-8"><title>SuiFleet motion overview</title>
<style>@font-face{font-family:Inter;src:url('/site/src/assets/inter-variable.woff2')}body{margin:0;background:#07182e}canvas{display:block}</style><canvas id="scene"></canvas>
<script>
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d');
const logo=new Image();logo.src='/site/src/assets/logo.svg';
window.ready=Promise.all([document.fonts.load('600 32px Inter'),logo.decode()]);
const B='#62baff',G='#81ebc4',W='#f4f8ff',M='#a1b9d4',D='#0c2541';
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=clamp(x);return 1-(1-x)**3},lerp=(a,b,t)=>a+(b-a)*t;
function label(s,x,y,size=24,color=W,align='center'){c.fillStyle=color;c.font=`600 ${size}px Inter`;c.textAlign=align;c.fillText(s,x,y)}
function box(x,y,w,h,color=D,r=20){c.beginPath();c.roundRect(x-w/2,y-h/2,w,h,r);c.fillStyle=color;c.fill();c.strokeStyle='#31516f';c.lineWidth=1.5;c.stroke()}
function line(a,b,color=B,width=3){c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(...a);c.lineTo(...b);c.stroke()}
function check(x,y,t,size=24){c.strokeStyle=G;c.lineWidth=5;c.lineCap='round';const p=[[-.6,0],[-.15,.45],[.65,-.5]],a=p[0],b=p[1],d=p[2];c.beginPath();c.moveTo(x+a[0]*size,y+a[1]*size);const q=clamp(t*2);c.lineTo(x+lerp(a[0],b[0],q)*size,y+lerp(a[1],b[1],q)*size);if(t>.5)c.lineTo(x+lerp(b[0],d[0],(t-.5)*2)*size,y+lerp(b[1],d[1],(t-.5)*2)*size);c.stroke()}
function device(x,y,s=1,name='',phase=0){c.save();c.translate(x,y);c.scale(s,s);box(0,0,94,126,'#102f4d',14);box(0,-10,66,72,'#071a30',5);c.fillStyle=phase>0?G:B;c.beginPath();c.arc(0,46,4,0,7);c.fill();if(phase>0)check(0,-10,1,20);else{c.strokeStyle=B;c.lineWidth=3;c.beginPath();c.arc(0,-10,17,phase,phase+4.3);c.stroke()}if(name)label(name,0,93,17);c.restore()}
function records(x,y,s=1){c.save();c.translate(x,y);c.scale(s,s);for(let i=0;i<3;i++){box(0,-40+i*40,118,31,'#123b5c',8);c.fillStyle=B;c.beginPath();c.arc(-42,-40+i*40,4,0,7);c.fill();line([-25,-40+i*40],[43,-40+i*40],'#467599',2)}c.restore()}
function file(x,y,s=1,locked=false){c.save();c.translate(x,y);c.scale(s,s);box(0,0,60,76,'#174b70',9);for(let i=0;i<3;i++)line([-16,-18+i*15],[16,-18+i*15],B,3);if(locked){box(18,18,28,25,'#164d46',5);c.strokeStyle=G;c.lineWidth=3;c.beginPath();c.arc(18,4,9,Math.PI,0);c.stroke()}c.restore()}
function store(x,y,s=1){c.save();c.translate(x,y);c.scale(s,s);for(let i=0;i<3;i++)box(0,-30+i*32,115,26,'#17435d',7);c.restore()}
function wallet(x,y,s=1){c.save();c.translate(x,y);c.scale(s,s);box(0,0,135,88,'#133e61',15);box(44,0,65,36,'#1c5a80',8);c.fillStyle=G;c.beginPath();c.arc(32,0,5,0,7);c.fill();c.restore()}
function consoleIcon(x,y,s=1){c.save();c.translate(x,y);c.scale(s,s);box(0,-8,150,95,'#123650',10);box(0,-10,127,70,'#071a30',4);line([-30,53],[30,53],M,5);line([0,40],[0,52],M,5);line([-45,-25],[17,-25],B,4);line([-45,-9],[43,-9],G,3);line([-45,7],[27,7],M,3);c.restore()}
function ring(x,y,r,t,color=B){c.save();c.globalAlpha=(1-t)*.65;c.strokeStyle=color;c.lineWidth=3;c.beginPath();c.arc(x,y,r+55*t,0,7);c.stroke();c.restore()}
function packet(a,b,p,kind='dot',color=G){p=clamp(p);const x=lerp(a[0],b[0],p),y=lerp(a[1],b[1],p);c.save();c.shadowBlur=18;c.shadowColor=color;if(kind==='file')file(x,y,.6,true);else{box(x,y,kind==='request'?40:25,kind==='request'?18:25,color,6)}c.restore()}
function connection(a,b,t,{color=B,count=3,reverse=false,kind='dot'}={}){line(a,b,'#294e6b',2);const end=reverse?a:b,start=reverse?b:a;for(let i=0;i<count;i++)packet(start,end,(t*.21+i/count)%1,kind,color);const ang=Math.atan2(end[1]-start[1],end[0]-start[0]);c.save();c.translate(...end);c.rotate(ang);c.fillStyle=color;c.beginPath();c.moveTo(0,0);c.lineTo(-13,-6);c.lineTo(-13,6);c.fill();c.restore()}
function pill(s,x,y,color=B,w=180){box(x,y,w,42,'#0e304b',12);label(s,x,y+7,19,color)}
function place(draw,x,y,t,delay=0,s=1){const p=ease((t-delay)/1.1);c.save();c.globalAlpha=p;c.translate(0,(1-p)*65);draw(x,y,s);c.restore()}
function stageFleet(t){const points=[[-355,-85],[-120,-85],[120,-85],[355,-85],[-355,135],[-120,135],[120,135],[355,135]];const p=ease(t/2),group=ease((t-4)/2);for(let i=0;i<8;i++){const [x,y]=points[i],gx=(i<4?-230:230)+(i%4-1.5)*95,gy=i<4?-10:110;const ax=lerp(x,gx,group),ay=lerp(y,gy,group);device(lerp(Math.cos(i)*600,ax,p),lerp(Math.sin(i)*350,ay,p)+Math.sin(t*1.2+i)*5,.66,`Device ${i+1}`,t+i)}if(group>0){c.globalAlpha=group;pill('Group A',-230,-150,B);pill('Group B',230,-150,G);c.globalAlpha=1;}ring(0,0,270,(t*.17)%1)}
function stageApprove(t){const a=[-285,20],b=[275,20];place(wallet,...a,t);place(records,...b,t,.6,1.1);label('Your wallet',a[0],125,25);label('Shared records',b[0],125,25);if(t>2){connection([-180,20],[165,20],t-2,{count:1,kind:'request'});pill(t<5?'Review request':'Approve change',0,-110,G,230)}if(t>4){const p=clamp((t-4)/1.3);line([-320,35],[-320+35*p,35-20*p],G,4);check(275,20,clamp((t-6)/.8),34);ring(275,20,80,((t-6)*.3)%1,G)}pill('Private key stays here',-285,190,M,250);c.save();c.translate(-350,-75);c.rotate(Math.sin(t)*.08);box(0,0,25,22,'#13413f',4);c.strokeStyle=G;c.beginPath();c.arc(0,-13,9,Math.PI,0);c.stroke();c.restore()}
function stagePublish(t){consoleIcon(-330,40,1.1);records(305,-100);store(305,135);label('Web console',-330,165,23);label('Sui · release record',305,-185,23);label('Walrus · files',305,235,23);if(t>1){connection([-220,0],[210,-100],t,{count:2,color:B});pill('Version + verification',0,-150,B,250)}if(t>4){connection([-220,80],[210,135],t,{count:2,kind:'file'});pill('Encrypted release',0,195,G,230)}ring(305,135,70,(t*.2)%1,G);file(-330,35,.65,t>5)}
function stagePoll(t){records(0,-110,1.1);label('Approved targets',0,-200,25);const ps=[[-345,130],[0,180],[345,130]];ps.forEach((p,i)=>{device(...p,.72,`Device ${i+1}`,t+i);const cycle=(t+i*1.7)%6,top=[p[0]*.25,-35],bottom=[p[0],p[1]-55];line(top,bottom,'#2c526f',2);if(cycle<3)packet(bottom,top,cycle/3,'request',B);else packet(top,bottom,(cycle-3)/3,'dot',G);ring(...p,55,cycle/6)});pill('Devices ask',-250,-30,B);pill('Read approved update',235,-30,G,250)}
function stageInstall(t){store(-330,-40,1.15);device(290,20,1.45,'Target device',0);label('Stored release',-330,100,24);const p=clamp((t-2)/6);if(t>1&&t<9)connection([-225,-40],[180,-40],t,{kind:'file',count:3});box(0,100,290,24,'#102b43',6);c.fillStyle=B;c.fillRect(-140,93,280*p,14);pill(t<8?'Download':t<12?'Verify release':'Run platform installer',0,-150,t<8?B:G,290);if(t>=8){c.save();c.translate(0,-10);c.rotate(t*.6);c.strokeStyle=G;c.lineWidth=4;for(let i=0;i<8;i++){c.rotate(Math.PI/4);line([36,0],[49,0],G,5)}c.beginPath();c.arc(0,0,29,0,7);c.stroke();c.restore();check(290,0,clamp((t-10)/1.5),30)}if(t>12)pill('Version updated',290,190,G,220)}
function stageReport(t){device(-325,20,1.12,'Device',1);records(295,-80);label('Shared records',295,-180,24);box(290,130,245,110,'#102e46');label('Console',290,115,22);pill('Install result',-10,-100,G,210);if(t>1)connection([-220,-15],[205,-80],t,{count:1,color:G,kind:'request'});if(t>4){label('Applied',290,153,23,G);check(385,150,1,15)}if(t>6){pill('Separate health sample',-25,150,B,265);connection([-220,70],[155,130],t-6,{count:1,color:B});ring(290,130,70,((t-6)*.2)%1,B)}label('Requested',-335,-150,22,M);if(t>3)label('≠',-180,-150,31,B);if(t>5)label('Applied',-70,-150,22,G);if(t>7)label('≠ Healthy',80,-150,22,B)}
function stageOverview(t){const a=[-355,0],b=[-20,-100],d=[325,130],f=[325,-105];place(consoleIcon,...a,t);place(records,...b,t,.6);place(store,...f,t,1.2);place(device,...d,t,1.8);if(t>2){connection([-265,-10],[-100,-90],t,{count:1});connection([65,-105],[245,-105],t,{kind:'file',count:1});connection([315,-35],[315,50],t,{count:1});connection([245,100],[40,-50],t,{count:1,color:G})}label('Console + wallet',a[0],115,22);label('Shared records',b[0],10,22);label('Files',f[0],-200,22);label('Device client',d[0],245,22);pill('Approve',-355,-145,B);pill('Check · verify · report',0,200,G,310)}
function stagePortrait(id,t){
 if(id==='fleet'){for(let i=0;i<8;i++){const x=(i%2?155:-155),y=-255+Math.floor(i/2)*180,p=ease(t/2);device(lerp(Math.cos(i)*650,x,p),lerp(Math.sin(i)*500,y,p)+Math.sin(t+i)*5,.82,`Device ${i+1}`,t+i)}if(t>4){pill('Group A',-155,-385,B,180);pill('Group B',155,-385,G,180)}return}
 if(id==='approve'){wallet(0,-230,1.35);label('Your wallet',0,-130,28);records(0,220,1.3);label('Shared records',0,340,28);connection([0,-90],[0,120],t,{count:1,kind:'request'});pill(t<5?'Review → approve':'Signed approval',185,0,G,225);pill('Key stays private',0,-345,M,260);if(t>6)check(0,220,clamp((t-6)),32);return}
 if(id==='publish'){consoleIcon(0,-245,1.25);label('Web console',0,-145,28);records(-175,120,1.1);store(175,120,1.1);label('Sui records',-175,245,27);label('Walrus files',175,245,27);connection([-45,-110],[-175,35],t,{count:1});if(t>4)connection([45,-110],[175,35],t,{count:1,kind:'file'});pill('Version + proof',-170,315,B,260);pill('Encrypted file',170,375,G,260);return}
 if(id==='poll'){records(0,-240,1.35);label('Approved targets',0,-115,29);[-210,0,210].forEach((x,i)=>{device(x,205,.9,'',t+i);const q=(t+i*1.5)%6;line([x,140],[x*.1,-70],'#315875',2);if(q<3)packet([x,140],[x*.1,-70],q/3,'request',B);else packet([x*.1,-70],[x,140],(q-3)/3,'dot',G);ring(x,205,50,q/6)});pill('Devices ask',0,345,B,245);return}
 if(id==='install'){store(0,-245,1.3);label('Stored release',0,-125,29);device(0,215,1.5,'Target device',0);if(t<9)connection([0,-80],[0,105],t,{kind:'file',count:2});pill(t<8?'Download':t<12?'Verify release':'Platform installer',195,0,t<8?B:G,250);const p=clamp((t-2)/6);box(0,375,410,23,'#122e45',6);c.fillStyle=B;c.fillRect(-200,368,400*p,14);if(t>10)check(0,200,clamp((t-10)),35);return}
 if(id==='report'){device(0,-250,1.05,'Device',1);records(-170,200);box(175,200,225,130);label('Console',175,180,27);if(t>1)connection([-50,-150],[-170,110],t,{count:1,kind:'request',color:G});if(t>5){connection([50,-150],[175,120],t,{count:1,color:B});label('Applied',175,230,25,G)}label('Shared records',-170,310,26);pill('Install result',-165,-30,G,240);pill('Health sample',165,40,B,240);label('Applied ≠ Healthy',0,395,29,M);return}
 consoleIcon(0,-310,1.15);label('Console + wallet',0,-205,27);records(-175,0);store(175,0);label('Shared records',-175,115,25);label('Stored files',175,115,25);device(0,285,1.08,'Device client',t);if(t>2){connection([-50,-180],[-175,-70],t,{count:1});connection([50,-180],[175,-70],t,{count:1,kind:'file'});connection([140,85],[45,205],t,{count:1});connection([-45,205],[-140,85],t,{count:1,color:G})}
}
window.renderFrame=async function({width,height,scene,localTime,index,total}){await window.ready;canvas.width=width;canvas.height=height;const portrait=height>width;const t=localTime;c.fillStyle='#07182e';c.fillRect(0,0,width,height);const grad=c.createRadialGradient(width*.5,height*.5,0,width*.5,height*.5,width);grad.addColorStop(0,'#163d5c');grad.addColorStop(1,'#07182e');c.fillStyle=grad;c.fillRect(0,0,width,height);c.save();c.globalAlpha=.12;for(let i=0;i<24;i++){const x=(i*133+t*7)%width,y=(i*89+t*3)%height;c.fillStyle=B;c.beginPath();c.arc(x,y,1.4,0,7);c.fill()}c.restore();c.drawImage(logo,36,28,44,44);label('SuiFleet',96,59,25,W,'left');label(`${index+1} / ${total}`,width-40,57,18,M,'right');
const title=scene.title.split(' '),size=portrait?40:42,max=width-85;let row='',lines=[];c.font=`600 ${size}px Inter`;for(const word of title){if(c.measureText(row+' '+word).width>max&&row){lines.push(row);row=word}else row+=(row?' ':'')+word}lines.push(row);lines.forEach((s,i)=>label(s,width/2,(portrait?145:130)+i*size*1.2,size));
const centerY=portrait?height*.55:height*.58,scale=portrait?.93:1;c.save();c.translate(width/2,centerY);c.scale(scale,scale);const alpha=Math.min(ease(t/.65),ease((scene.duration-t)/.6));c.globalAlpha=alpha;c.translate(0,(1-ease(t/.8))*35);if(portrait)stagePortrait(scene.id,t);else ({fleet:stageFleet,approve:stageApprove,publish:stagePublish,poll:stagePoll,install:stageInstall,report:stageReport,overview:stageOverview})[scene.id](t);c.restore();c.fillStyle='#294765';c.fillRect(40,height-34,width-80,3);c.fillStyle=B;c.fillRect(40,height-34,(width-80)*(index+clamp(t/scene.duration))/total,3);return canvas.toDataURL('image/png').split(',')[1];};
</script>
