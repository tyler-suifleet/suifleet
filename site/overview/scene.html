<!doctype html><meta charset="utf-8"><title>SuiFleet animated overview source</title>
<style>@font-face{font-family:Inter;src:url('/site/src/assets/inter-variable.woff2')}body{margin:0;background:#07182e}canvas{display:block}</style><canvas id="scene"></canvas>
<script>
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d');
let logo=new Image();logo.src='/site/src/assets/logo.svg';
window.ready=Promise.all([document.fonts.load('600 32px Inter'),logo.decode()]);
const BLUE='#59b8ff',INK='#0c2443',MUTED='#a9bed6',WHITE='#f5f9ff',GREEN='#7ae3b3';
function rounded(x,y,w,h,r=18){c.beginPath();c.roundRect(x,y,w,h,r)}
function text(t,x,y,size=25,color=WHITE,weight=500,align='center'){c.font=`${weight} ${size}px Inter`;c.fillStyle=color;c.textAlign=align;c.fillText(t,x,y)}
function wrap(t,x,y,width,size,color=WHITE,weight=650){let words=t.split(' '),line='',lines=[];c.font=`${weight} ${size}px Inter`;for(const word of words){let next=line?line+' '+word:word;if(c.measureText(next).width>width&&line){lines.push(line);line=word}else line=next}lines.push(line);lines.forEach((v,i)=>text(v,x,y+i*size*1.18,size,color,weight));return lines.length*size*1.18}
function card(x,y,w,h,active){c.shadowColor=active?'#258bd34d':'transparent';c.shadowBlur=active?25:0;rounded(x-w/2,y-h/2,w,h);c.fillStyle=active?'#113554':'#0b223d';c.fill();c.shadowBlur=0;c.strokeStyle=active?BLUE:'#24405c';c.lineWidth=active?2.5:1;c.stroke()}
function arrow(a,b,t,active,offset=0){const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;const start=[a[0]+ux*60,a[1]+uy*60],end=[b[0]-ux*64,b[1]-uy*64];c.strokeStyle=active?BLUE:'#294461';c.lineWidth=active?3:1.5;c.setLineDash([5,8]);c.beginPath();c.moveTo(...start);c.lineTo(...end);c.stroke();c.setLineDash([]);if(active){let p=(t*.24+offset)%1;c.fillStyle=GREEN;c.beginPath();c.arc(start[0]+(end[0]-start[0])*p,start[1]+(end[1]-start[1])*p,6,0,Math.PI*2);c.fill();c.beginPath();c.moveTo(...end);c.lineTo(end[0]-ux*14-uy*7,end[1]-uy*14+ux*7);c.lineTo(end[0]-ux*14+uy*7,end[1]-uy*14-ux*7);c.closePath();c.fill()}}
function uploadArrow(a,b,t,portrait){const q=portrait?[740,440]:[640,160];c.strokeStyle=BLUE;c.lineWidth=3;c.setLineDash([5,8]);c.beginPath();c.moveTo(...a);c.quadraticCurveTo(...q,...b);c.stroke();c.setLineDash([]);let p=(t*.22)%1;c.fillStyle=GREEN;c.beginPath();c.arc((1-p)*(1-p)*a[0]+2*(1-p)*p*q[0]+p*p*b[0],(1-p)*(1-p)*a[1]+2*(1-p)*p*q[1]+p*p*b[1],6,0,7);c.fill()}

function icon(kind,x,y,color){c.save();c.strokeStyle=color;c.fillStyle=color;c.lineWidth=3;c.lineCap='round';c.translate(x,y);if(kind==='wallet'){rounded(-27,-18,54,36,7);c.stroke();rounded(5,-9,26,18,5);c.stroke();c.beginPath();c.arc(16,0,2,0,7);c.fill()}else if(kind==='records'){for(let i=0;i<3;i++){rounded(-24,-24+i*19,48,14,4);c.stroke()}}else if(kind==='files'){rounded(-25,-24,50,48,6);c.stroke();for(let i=0;i<3;i++){c.beginPath();c.moveTo(-13,-10+i*11);c.lineTo(13,-10+i*11);c.stroke()}}else if(kind==='devices'){for(let i=0;i<3;i++){let bx=-47+i*32,by=i===1?-24:-12;rounded(bx,by,26,38,5);c.stroke();c.beginPath();c.arc(bx+13,by+30,2,0,7);c.fill()}}else{c.beginPath();c.arc(0,0,24,0,7);c.stroke();c.beginPath();c.moveTo(-12,0);c.lineTo(-3,10);c.lineTo(13,-10);c.stroke()}c.restore()}
window.renderFrame=async function({width,height,scene,localTime,index,total}){await window.ready;canvas.width=width;canvas.height=height;const portrait=height>width;c.fillStyle='#07182e';c.fillRect(0,0,width,height);const grad=c.createRadialGradient(width*.6,height*.5,10,width*.6,height*.5,width*.7);grad.addColorStop(0,'#143454');grad.addColorStop(1,'#07182e');c.fillStyle=grad;c.fillRect(0,0,width,height);
 c.save();c.globalAlpha=.13;for(let x=24;x<width;x+=48)for(let y=24;y<height;y+=48){c.fillStyle='#95cfff';c.beginPath();c.arc(x,y,1,0,7);c.fill()}c.restore();
 c.drawImage(logo,portrait?34:48,30,portrait?46:40,40);text('SuiFleet',portrait?92:98,59,25,WHITE,750,'left');text(`${index+1} / ${total}`,width-42,58,20,MUTED,500,'right');
 let titleY=portrait?132:126;wrap(scene.title,width/2,titleY,width-90,portrait?43:45);wrap(scene.subtitle,width/2,portrait?242:185,width-100,portrait?27:24,MUTED,450);
 const nodes=portrait?{wallet:[360,365],records:[360,575],files:[555,800],devices:[200,800],result:[360,1030]}:{wallet:[170,360],records:[510,360],files:[1030,285],devices:[1030,515],result:[510,550]};
 const ids=['wallet','records','files','devices','result'];const active={fleet:['devices'],approve:['wallet','records'],publish:['wallet','records','files'],poll:['devices','records'],install:['files','devices'],report:['devices','records','result'],overview:ids}[scene.id];
 arrow(nodes.wallet,nodes.records,localTime,['approve','publish','overview'].includes(scene.id));
 if(['publish','overview'].includes(scene.id))uploadArrow(nodes.wallet,nodes.files,localTime,portrait);
 if(['poll','overview'].includes(scene.id))arrow(nodes.devices,nodes.records,localTime,true);else arrow(nodes.records,nodes.devices,localTime,['overview'].includes(scene.id),.4);
 arrow(nodes.files,nodes.devices,localTime,['install','overview'].includes(scene.id));arrow(nodes.devices,nodes.result,localTime,['report','overview'].includes(scene.id));arrow(nodes.result,nodes.records,localTime,['report','overview'].includes(scene.id));
 const labels={wallet:['Your web console','Approve with your wallet'],records:['Shared records','Sui'],files:['Software files','Walrus'],devices:['Your device clients','Check when connected'],result:['Device reports','Results + separate health']};
 for(const id of ids){let[x,y]=nodes[id],isActive=active.includes(id);card(x,y,portrait?(id==='files'||id==='devices'?285:330):260,portrait?140:122,isActive);icon(id,x,y-25,isActive?BLUE:MUTED);text(labels[id][0],x,y+24,portrait?25:23,WHITE,650);text(labels[id][1],x,y+53,portrait?20:18,MUTED,450)}
 const notes={fleet:'One machine · groups · staged rollouts',approve:'A signature authorizes a change — private keys stay private.',publish:'Confidential files: encrypted access through Seal.',poll:'Devices read approved targets on their own schedule.',install:'Verify the release. Invoke your platform’s installer.',report:'Requested ≠ Applied ≠ Healthy',overview:'No SuiFleet application server. External services still matter.'};
 rounded(32,height-100,width-64,56,15);c.fillStyle='#102d49';c.fill();text(notes[scene.id],width/2,height-65,portrait?18:23,scene.id==='report'?GREEN:MUTED,550);
 const progress=Math.min(1,localTime/scene.duration);c.fillStyle=BLUE;c.fillRect(0,height-5,width*(index+progress)/total,5);return canvas.toDataURL('image/png').split(',')[1];}
</script>
