BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "meta-suifleet"
BBFILE_PATTERN_meta-suifleet = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-suifleet = "6"

LAYERVERSION_meta-suifleet = "1"
LAYERDEPENDS_meta-suifleet = "core openembedded-layer scarthgap-rust-mixin"
LAYERSERIES_COMPAT_meta-suifleet = "scarthgap"
