BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "suifleet-integration"
BBFILE_PATTERN_suifleet-integration = "^${LAYERDIR}/"
BBFILE_PRIORITY_suifleet-integration = "6"
LAYERVERSION_suifleet-integration = "1"
LAYERDEPENDS_suifleet-integration = "meta-suifleet raspberrypi"
LAYERSERIES_COMPAT_suifleet-integration = "scarthgap wrynose"
