[package]
name = "suifleet-windows"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading",
  "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Memory",
  "Win32_System_Services", "Win32_System_Environment"
] }
