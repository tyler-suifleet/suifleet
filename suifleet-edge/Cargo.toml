[package]
name = "suifleet"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "suifleet"
path = "src/main.rs"

[dependencies]
# Sui gRPC v2 API and transaction types (Mysten's official Rust SDK)
sui-rpc = "0.4.0"
sui-sdk-types = { version = "0.4.0", features = ["serde", "hash"] }
sui-transaction-builder = "0.4.0"
tonic = { version = "0.14", default-features = false }
prost-types = "0.14"
bcs = "0.1"
# Walrus aggregator downloads over HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Crypto — ed25519 signing for SUI transactions
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"

# SHA-256 verification + SHA3-256 for SUI address derivation
sha2 = "0.10"
blake2 = "0.10"
fs2 = "0.4"
libc = "0.2"
shell-words = "1"
digest = "0.10"

# Config + serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
base64 = "0.21"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# systemd watchdog (optional; only links when building on systemd systems)
sd-notify = { version = "0.4", optional = true }

[dev-dependencies]
# Test-only gRPC front end for the Python chain simulator (examples/grpc_sim_shim.rs).
tonic = { version = "0.14", features = ["transport", "router"] }
sui-crypto = { version = "0.4.0", features = ["ed25519"] }
tokio-stream = { version = "0.1", features = ["net"] }
prost = "0.14"

[features]
default = ["systemd"]
systemd = ["sd-notify"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
