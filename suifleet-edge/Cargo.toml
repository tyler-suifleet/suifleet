[package]
name = "suifleet"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "suifleet"
path = "src/main.rs"

[dependencies]
# SUI JSON-RPC over HTTP/WebSocket (no heavy SDK needed for embedded targets)
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
futures-util = "0.3"

# Crypto — ed25519 signing for SUI transactions
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
bs58 = "0.5"
hex = "0.4"

# SHA-256 verification + SHA3-256 for SUI address derivation
sha2 = "0.10"
sha3 = "0.10"
digest = "0.10"

# Config + serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
base64 = "0.21"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# systemd watchdog (optional; only links when building on systemd systems)
sd-notify = { version = "0.4", optional = true }

[features]
default = ["systemd"]
systemd = ["sd-notify"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
