[package]
name = "suifleet"
version = "0.2.1"
edition = "2021"

[[bin]]
name = "suifleet"
path = "src/main.rs"

[target.'cfg(not(windows))'.dependencies]
semver = "=1.0.28"
# Sui gRPC v2 API and transaction types (Mysten's official Rust SDK)
sui-rpc = "0.4.0"
sui-sdk-types = { version = "0.4.0", features = ["serde", "hash"] }
sui-transaction-builder = "0.4.0"
tonic = { version = "0.14", default-features = false }
prost-types = "0.14"
bcs = "0.1"
# Walrus aggregator downloads over HTTP
# rustls with the system CA store: one TLS stack (tonic already uses rustls)
# and no OpenSSL to cross-compile for release artifacts.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "charset", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["full"] }
# AWS IoT Core key material (SF-061) and Seal plaintext/keys (SF-022) are
# wiped after use.
zeroize = "1"
futures-util = "0.3"
# Mutual TLS for LAN client devices (SF-035) and AWS IoT Core (SF-061) on the
# ring provider rustls already uses, and a local CA that issues certificates
# from CSRs (SF-035)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
pem = "4"
x509-parser = "0.18"
time = "0.3"

# Crypto — ed25519 signing for SUI transactions
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"

# SHA-256 verification + SHA3-256 for SUI address derivation
sha2 = "0.10"
blake2 = "0.10"
fs2 = "0.4"
libc = "0.2"
shell-words = "1"
digest = "0.10"

# Seal threshold decryption (SF-022): BLS12-381 IBE, ElGamal and the DEMs
# (AES-256-GCM, HMAC-SHA3-256 CTR), in pure Rust for every target.
ark-bls12-381 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-serialize = "0.5"
aes-gcm = "0.10"
hmac = "0.12"
sha3 = "0.10"

# Config + serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
base64 = "0.21"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# PKCS#11 signer (feature "pkcs11"): token access and P-256 encoding
cryptoki = { version = "0.10", optional = true }
p256 = { version = "0.13", optional = true, features = ["ecdsa"] }

# systemd watchdog (optional; only links when building on systemd systems)
sd-notify = { version = "0.4", optional = true }

[target.'cfg(not(windows))'.dev-dependencies]
# Test-only gRPC front end for the Python chain simulator (examples/grpc_sim_shim.rs).
tonic = { version = "0.14", features = ["transport", "router"] }
sui-crypto = { version = "0.4.0", features = ["ed25519", "secp256r1"] }
tokio-stream = { version = "0.1", features = ["net"] }
prost = "0.14"

[features]
default = ["systemd"]
systemd = ["sd-notify"]
# Device keys in PKCS#11 tokens (SF-021): Sui secp256r1 signatures.
pkcs11 = ["dep:cryptoki", "dep:p256"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
anyhow = "1"
suifleet-windows = { path = "windows-runtime" }

# Native backend tests and the shipped daemon must use one dependency resolution.
[workspace]
members = ["windows-runtime"]
resolver = "2"
