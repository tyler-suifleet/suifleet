[sui]
# Generated together with frontend.env; path is relative to this config.
manifest_path = "deployment.json"

[device]
keypair_path = "/etc/suifleet/device.key"   # 32-byte hex ed25519 private key
# Production: keep the key in the signing service instead (docs/KEY_ISOLATION.md;
# not combinable with [daemon_update]):
# [device.signer]
# kind = "service"
# socket = "/run/suifleet-signer/sign.sock"
device_object_id = "0x..."                      # Device object ID from registration
device_cap_id    = "0x..."                      # DeviceCap object ID
# Or keep the key in a PKCS#11 token (build with --features pkcs11; docs/ENROLLMENT.md):
# [device.signer]
# kind = "pkcs11"
# module = "/usr/lib/softhsm/libsofthsm2.so"
# token_label = "suifleet"
# key_label = "device"
# pin_file = "/etc/suifleet/pkcs11.pin"
# The aggregator URL comes from the deployment manifest. Optional download limits:
# [walrus]
# max_artifact_bytes = 1073741824   # refuse larger artifacts (default 1 GiB)
# min_free_bytes = 67108864         # keep this much free on the state filesystem (default 64 MiB)
# download_attempts = 4             # per blob, for drops, timeouts, 5xx and 429; resumes with HTTP Range
# download_timeout_seconds = 3600   # give up on a blob after this long, across all attempts

[apply]
# Command to invoke when an artifact is ready. The artifact path is appended as the final argument.
# Examples:
#   command = "/usr/bin/swupdate -i"
#   command = "/usr/bin/rauc install"
#   command = "/usr/local/bin/my-update-handler"
command = "/usr/bin/swupdate -i"

# Bound the updater execution time. Recipe shell commands require explicit opt-in.
timeout_seconds = 600
allow_recipe_commands = false

# How firmware reaches the updater (see docs/OPERATIONS.md, "Execution privileges").
# "direct" (default) runs `command` as the daemon user. Under the shipped
# systemd unit that user is unprivileged, so use "privileged-helper" for
# updaters that need root: suifleet-firmware.service then runs the command
# from root-owned /etc/suifleet/firmware.toml and `command` here is unused.
# mode = "privileged-helper"
# firmware_spool = "/var/lib/suifleet/firmware"
# max_memory_bytes = 268435456   # optional RLIMIT_AS for updater/recipe children

[runtime]
state_dir = "/var/lib/suifleet"
poll_seconds = 10

# First enrollment skips historical events; existing cursors always catch up.
# Enable only if explicitly replaying old one-shot deployments is safe.
replay_history = false

# Supervised components (recipes with lifecycle.run; docs/OPERATIONS.md).
# component_startup_seconds = 3        # ready after surviving this long, without a readiness command
# component_ready_timeout_seconds = 60 # how long a readiness command may keep failing
# component_stop_timeout_seconds = 10  # grace for shutdown/SIGTERM before SIGKILL
# component_max_restarts = 5           # within ten minutes, then Broken

# Let the daemon's group read its own and its components' logs and the
# retained confidential values (0640, directories 0750), for a separate log
# reader such as the CloudWatch Logs adapter (docs/CLOUDWATCH_LOGS.md).
# Changing it applies to existing files at the next daemon start.
# log_group_read = false

# Dependency candidates: "never" (default) uses only the live catalog and
# Walrus; "cached" keeps authenticated versions/recipes/artifacts under
# state_dir/components for reuse and offline resolution.
# See docs/COMPONENT_DEPENDENCIES.md.
# [components]
# offline_candidates = "never"
# cache_max_bytes = 536870912
# Component configuration (recipe 1.2; see docs/OPERATIONS.md). Confidential
# values come only from <configuration_overlay_dir>/<name>.json, an object of
# JSON pointer -> value that must not be accessible to other users.
# configuration_overlay_dir = "/etc/suifleet/component-config"
# configuration_defer_max_seconds = 86400  # then a deferring validate fails

# Daemon self-update (docs/DAEMON_UPDATE.md); requires ExecStart=suifleet --launch.
# [daemon_update]
# enabled = false
# component = "suifleet-daemon"
# max_start_attempts = 3
# preflight_timeout_seconds = 60

# Product health/logs use [fleet_data] and [fleet_data.archives] below.
# HTTP [telemetry] is an optional customer-owned integration only.
# Local support console (docs/LOCAL_CONSOLE.md): loopback only, authenticated,
# audited. Tokens come from `suifleet --console-token`; store only the hash.
# [console]
# listen = "127.0.0.1:1441"
# support_operations = ["restart"]   # subset of start, stop, restart
# [console.users.support]
# token_sha256 = "<token_sha256>"
# grants = ["inventory", "health", "deployments", "logs", "configuration", "audit", "restart"]

# [telemetry]
# url = "https://customer.example" # customer-owned ingress, never SuiFleet hosted
# interval_seconds = 60           # 10..=3600
# buffer_max = 1024               # snapshots kept offline; oldest dropped beyond

# Prepaid network costs (docs/FLEET_BUDGET.md): top up this device's gas from
# the owner's on-chain fleet budget. The contract bounds every draw (float cap,
# period allowance, rate); these only choose when. Needs a manifest with the
# fleet budget type origins; with the service signer, also [budget] in signer.toml.
# [budget]
# budget_id = "0x<FleetBudget object ID>"
# low_water_mist = 20000000   # draw below 0.02 SUI; keep above one draw's gas
# draw_mist = 50000000        # asked per draw

# Confidential delivery (docs/CONFIDENTIAL_DELIVERY.md): decrypt Seal-encrypted
# recipes and artifacts with this device's own identity. "required" refuses
# unencrypted ones. Key servers are trusted by object ID; their URL and public
# key come from chain. Testnet values shown (Mysten's open key servers).
# [seal]
# mode = "required"
# key_server_package = "0x0f16e84a49dec8425e6900cfdfe3730aaf1e8bc608d9f0500fcfa2c2267abfb4"
# key_servers = [
#   { object_id = "0x73d05d62c18d9374e3ea529e8e0ed6161da1a141a94d3f76ae3fe4e99356db75" },
#   { object_id = "0xf5d14a81a982144ae441cd7d64b09027f116a468bd36e7eca494f750591623c8" },
# ]
# min_threshold = 2
# session_ttl_minutes = 10   # with [device.signer] kind = "service", set in signer.toml instead
# key_cache_seconds = 120    # fetched keys stay in memory only this long
# max_plaintext_bytes = 134217728
# A provider credential (not device identity): api_key_name = "X-API-Key",
# api_key_file = "/etc/suifleet/seal-api-key" inside a key server's entry.

# Durable local pub/sub and the local MQTT bridge (SF-032; docs/MESSAGING.md).
# Components need pubsub_policies under [ipc.components.NAME].
# [pubsub]
# max_messages_per_subscription = 1000
# max_bytes_per_subscription = 4194304
# qos0_messages_per_subscription = 100
# [pubsub.bridge]
# broker = "127.0.0.1:1883"
# [[pubsub.bridge.mappings]]
# topic = "sensors/#"
# source = "Pubsub"
# target = "LocalMqtt"
# target_topic_prefix = "device1/"

# LAN client devices: a local CA, mutual TLS and an authorizing MQTT proxy in
# front of a loopback-only broker (SF-035; docs/CLIENT_DEVICES.md). Needs [ipc]
# administrators, who enroll things from CSRs with the client_devices operation.
# [client_devices]
# device_groups_file = "client-device-groups.json"   # AWS deviceGroups JSON
# broker = "127.0.0.1:1883"
# broker_username = "gateway"
# broker_password_file = "/etc/suifleet/gateway-mqtt-password"
# mqtt_listen = "0.0.0.0:8883"
# https_listen = "0.0.0.0:8443"
# udp_discovery = "0.0.0.0:8442"
# certificate_validity_seconds = 604800
# rotation_grace_seconds = 300

# Redacted logs for Walrus archives (or optional customer HTTP integration).
# [logs]
# interval_seconds = 60
# max_lines_per_interval = 512
# buffer_max = 256

# Durable local streams and export (SF-034; docs/STREAMS.md). Components need
# stream operations and a `streams` glob under [ipc.components.NAME].
# [streams]
# max_streams = 32
# max_total_bytes = 67108864        # sum of all streams' max_size
# [[streams.definitions]]
# name = "telemetry"
# max_size = 16777216               # each message costs its bytes + 64
# strategy_on_full = "RejectNewData"  # or "OverwriteOldestData"
# [streams.definitions.export]
# url = "https://ingest.example/v1/streams"
# bearer_token_file = "/etc/suifleet/stream-export.token"

# Local device shadows and cloud sync (SF-033; docs/SHADOWS.md). Components need
# shadow operations and shadow_policies under [ipc.components.NAME]; change
# notifications need [pubsub].
# [shadows]
# thing_name = "device1"            # in $aws/things/<thing>/shadow resources and topics
# max_shadows = 64                  # 1..=128 existing shadows
# [shadows.sync]
# url = "https://shadows.example/v1/sync"
# bearer_token_file = "/etc/suifleet/shadow-sync.token"
# shadows = ["", "config"]          # "" is the classic shadow
# interval_seconds = 30
# desired_conflict = "cloud"        # who wins a key both sides changed
# reported_conflict = "device"

# Product Sui/Walrus fleet backend (no HTTP indexer).
# Optional customer HTTP health may coexist; archives exclusively collect logs.
# Owner creates/enrolls these objects first; use their actual introduction origin.
# [fleet_data]
# package_id = "0x<FleetData call package>"
# type_origin = "0x<FleetData introduction package>"
# fleet_id = "0x<FleetData>"
# budget_id = "0x<FleetBudget>"
# storage_id = "0x<FleetStorage>"
# writer_id = "0x<this device's indexed DeviceData>"
# account_id = "0x<this device's current GasAccount>"
#
# Encrypted archives additionally need [logs] collection limits. Build the
# keyless codec with scripts/build_walrus_codec.cjs; install its bundle and WASM
# together in a root-owned directory, plus Node 22.22.2. No SDK tree is needed.
# [fleet_data.archives]
# storage_package = "0x<fleet_storage call package>"
# storage_type_origin = "0x<fleet_storage introduction package>"
# system_id = "0x<pinned Testnet Walrus System>"
# walrus_package = "0x<live, compiler-pinned Testnet Walrus package>"
# key_server_package = "0x<Seal key server package>"
# key_servers = [{ object_id = "0x<public key server object>", weight = 1 }]
# threshold = 1
# node = "/usr/bin/node"
# codec = "/usr/lib/suifleet/walrus-codec/walrus-device-codec.cjs"
# codec_sha256 = "<manifest.json files.walrus-device-codec.cjs.sha256>"
#
# The signing service needs the same [fleet_data] object bindings and archive
# storage bindings in signer.toml. It permits only these bounded native intents;
# the codec process receives ciphertext, never a key, PIN or signing socket.
