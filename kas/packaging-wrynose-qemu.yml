header:
  version: 14
  includes:
    - packaging-wrynose.yml
machine: qemuarm64
target:
  - core-image-minimal
  - qemu-system-native
local_conf_header:
  suifleet-packaging-emulation: |
    IMAGE_INSTALL:append = " suifleet suifleet-test-component coreutils"
    IMAGE_FSTYPES = "ext4"
    EXTRA_IMAGE_FEATURES:append = " allow-empty-password allow-root-login empty-root-password"
    QEMU_TARGETS = "aarch64"
    PACKAGECONFIG:remove:pn-qemu-system-native = "virglrenderer epoxy sdl sdl-image alsa"
