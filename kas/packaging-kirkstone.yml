header:
  version: 14
machine: raspberrypi3-64
distro: poky
target: suifleet
repos:
  suifleet:
    layers:
      suifleet-edge/meta-suifleet:
      suifleet-edge/meta-suifleet-integration:
  poky:
    url: https://git.yoctoproject.org/poky
    commit: 445a6223929b9a7a62b575093659e3d9e1aba982
    layers:
      meta:
      meta-poky:
  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    commit: ce8539c941f6fcbecaca4d16640ac105c0595589
    layers:
      meta-oe:
  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi
    commit: 255500dd9f6a01a3445ac491d1abc401801e3bad
  meta-lts-mixins:
    url: https://git.yoctoproject.org/meta-lts-mixins
    branch: kirkstone/rust
    commit: 6baa9afeb88a4a9b4a0e82dd7e3e611438999dbb
local_conf_header:
  suifleet-packaging: |
    BB_NUMBER_THREADS = "2"
    PARALLEL_MAKE = "-j4"
    RUST_LLVM_TARGETS = "AArch64;X86"
    DISTRO_FEATURES:append = " systemd usrmerge"
    DISTRO_FEATURES_BACKFILL_CONSIDERED:append = " sysvinit"
    VIRTUAL-RUNTIME_init_manager = "systemd"
    VIRTUAL-RUNTIME_initscripts = ""
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"
