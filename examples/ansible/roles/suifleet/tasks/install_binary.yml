---
# The same files and accounts as the Yocto recipe and the Debian package
# (docs/INSTALL_DEVICE_CLIENT.md#generic-linux). Firmware helpers are not
# installed; enable them only through docs/OPERATIONS.md#execution-privileges.
- name: Create the separate daemon and signer groups
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
  loop: [suifleet, suifleet-signer]

- name: Create the unprivileged daemon and signer users
  ansible.builtin.user:
    name: "{{ item.name }}"
    group: "{{ item.name }}"
    groups: []
    system: true
    create_home: false
    home: "{{ item.home }}"
    shell: /usr/sbin/nologin
  loop:
    - {name: suifleet, home: /var/lib/suifleet}
    - {name: suifleet-signer, home: /nonexistent}

# The binary is uploaded to a private per-run file and its SHA-256 checked on
# the host; only then is it renamed to the cache path named by the pinned
# digest, from which it replaces /usr/bin/suifleet (an atomic rename by the
# copy module). A file already at that path is reused only after the same
# check. So the cache path only ever holds verified bytes of that digest, even
# when overlapping rollouts upload the same or another release, or a
# controller's artifact changes after its preflight check.
- name: Create the private staging directory
  ansible.builtin.file:
    path: /var/cache/suifleet
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Choose the release-specific staging path
  ansible.builtin.set_fact:
    suifleet_binary_staging: "/var/cache/suifleet/suifleet-{{ suifleet_binary_sha256 }}.staged"

- name: Check for an already verified staged binary
  ansible.builtin.stat:
    path: "{{ suifleet_binary_staging }}"
    get_checksum: true
    checksum_algorithm: sha256
  register: suifleet_binary_cached
  check_mode: false

- name: Upload, verify and publish the binary
  when: not (suifleet_binary_cached.stat.exists and suifleet_binary_cached.stat.checksum == suifleet_binary_sha256)
  block:
    - name: Choose this run's private upload path
      ansible.builtin.set_fact:
        suifleet_binary_incoming: >-
          /var/cache/suifleet/incoming-{{ suifleet_binary_sha256 }}-{{ lookup('ansible.builtin.password', '/dev/null',
          chars=['ascii_lowercase', 'digits'], length=24) }}.part

    - name: Stage the authenticated binary
      ansible.builtin.copy:
        src: "{{ suifleet_binary_src }}"
        dest: "{{ suifleet_binary_incoming }}"
        owner: root
        group: root
        mode: "0700"
      register: suifleet_binary_staged

    # In check mode nothing was uploaded; the controller-side digest was
    # already verified in preflight.
    - name: Check the staged binary on the host
      ansible.builtin.stat:
        path: "{{ suifleet_binary_incoming }}"
        get_checksum: true
        checksum_algorithm: sha256
      register: suifleet_binary_remote
      when: not ansible_check_mode

    - name: Refuse a staged binary that differs from the pinned SHA-256
      ansible.builtin.assert:
        that:
          - suifleet_binary_remote.stat.exists
          - suifleet_binary_remote.stat.checksum == suifleet_binary_sha256
        quiet: true
        fail_msg: The staged binary on the host does not match the pinned SHA-256.
      when: not ansible_check_mode

    # rename(2) within the directory: the shared name only ever holds bytes
    # some run verified against this same digest.
    - name: Publish the verified binary under its digest-named path
      ansible.builtin.command:
        argv: [mv, -f, --, "{{ suifleet_binary_incoming }}", "{{ suifleet_binary_staging }}"]
      changed_when: true
      when: not ansible_check_mode
  rescue:
    - name: Remove this run's unverified upload
      ansible.builtin.file:
        path: "{{ suifleet_binary_incoming }}"
        state: absent
      when: suifleet_binary_incoming is defined

    - name: Stop after an unverified binary
      ansible.builtin.fail:
        msg: >-
          Staging the binary failed, or the bytes uploaded to the host did not
          match the pinned SHA-256 {{ suifleet_binary_sha256 }}. This run's upload was
          removed and nothing was installed.

- name: Report the pending binary installation
  ansible.builtin.debug:
    msg: Would install the staged binary as /usr/bin/suifleet.
  changed_when: true
  when: ansible_check_mode and suifleet_binary_staged is changed

- name: Install the verified binary
  ansible.builtin.copy:
    src: "{{ suifleet_binary_staging }}"
    remote_src: true
    dest: /usr/bin/suifleet
    owner: root
    group: root
    mode: "0755"
  register: suifleet_binary_copy
  when: not (ansible_check_mode and suifleet_binary_staged is changed)

- name: Remove other releases' staged artifacts
  ansible.builtin.import_tasks: prune_staging.yml
  vars:
    suifleet_staging_keep: "{{ suifleet_binary_staging }}"

- name: Install the provisioning helper
  ansible.builtin.copy:
    src: "{{ suifleet_units_src }}/suifleet-provision"
    dest: /usr/libexec/suifleet-provision
    owner: root
    group: root
    mode: "0755"
  register: suifleet_helper_copy

- name: Install the systemd units
  ansible.builtin.copy:
    src: "{{ suifleet_units_src }}/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - suifleet.service
    - suifleet-signer.service
    - suifleet-signer.socket
    - suifleet-provision.service
    - suifleet-enrollment.path
  register: suifleet_units_copy

- name: Create the configuration directory
  ansible.builtin.file:
    path: /etc/suifleet
    state: directory
    owner: root
    group: suifleet
    mode: "0750"

- name: Create the daemon state directory
  ansible.builtin.file:
    path: /var/lib/suifleet
    state: directory
    owner: suifleet
    group: suifleet
    mode: "0700"

- name: Install the configuration templates beside the real files
  ansible.builtin.copy:
    src: "{{ suifleet_units_src }}/{{ item.name }}"
    dest: "/etc/suifleet/{{ item.name }}"
    owner: root
    group: "{{ item.group }}"
    mode: "0640"
  loop:
    - {name: signer.toml.example, group: suifleet-signer}
    - {name: config.toml.example, group: suifleet}

- name: Reload systemd after unit changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: suifleet_units_copy is changed

- name: Record whether the client code changed
  ansible.builtin.set_fact:
    suifleet_code_changed: >-
      {{ suifleet_binary_staged is changed or suifleet_binary_copy is changed
         or suifleet_helper_copy is changed
         or suifleet_units_copy is changed }}
