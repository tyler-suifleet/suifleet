---
- name: Create the private package staging directory
  ansible.builtin.file:
    path: /var/cache/suifleet
    state: directory
    owner: root
    group: root
    mode: "0700"

# The staging path names the pinned digest, so an overlapping rollout of
# another release never writes the file this rollout verified and installs.
- name: Choose the release-specific staging path
  ansible.builtin.set_fact:
    suifleet_deb_staging: "/var/cache/suifleet/suifleet_{{ suifleet_deb_arch }}-{{ suifleet_deb_sha256 }}.deb"

- name: Stage the authenticated package
  ansible.builtin.copy:
    src: "{{ suifleet_deb_src }}"
    dest: "{{ suifleet_deb_staging }}"
    owner: root
    group: root
    mode: "0600"
  register: suifleet_deb_staged

# In check mode a pending copy leaves the old staged bytes in place, so the
# host-side checks and apt run only on bytes actually present; the
# controller-side digest was already verified in preflight.
- name: Check the staged package on the host
  ansible.builtin.stat:
    path: "{{ suifleet_deb_staging }}"
    get_checksum: true
    checksum_algorithm: sha256
  register: suifleet_deb_remote
  check_mode: false
  when: not (ansible_check_mode and suifleet_deb_staged is changed)

- name: Refuse a staged package that differs from the pinned SHA-256
  ansible.builtin.assert:
    that:
      - suifleet_deb_remote.stat.exists
      - suifleet_deb_remote.stat.checksum == suifleet_deb_sha256
    quiet: true
    fail_msg: The staged package on the host does not match the pinned SHA-256.
  when: suifleet_deb_remote is not skipped

- name: Report the pending package installation
  ansible.builtin.debug:
    msg: Would install or upgrade the staged package.
  changed_when: true
  when: ansible_check_mode and suifleet_deb_staged is changed

# The package starts nothing and stops running units before an upgrade
# (docs/DEBIAN_PACKAGING.md); the service tasks start them again afterwards.
- name: Install or upgrade the package
  ansible.builtin.apt:
    deb: "{{ suifleet_deb_staging }}"
  register: suifleet_package
  when: suifleet_deb_remote is not skipped and suifleet_deb_remote.stat.exists

- name: Remove other releases' staged artifacts
  ansible.builtin.import_tasks: prune_staging.yml
  vars:
    suifleet_staging_keep: "{{ suifleet_deb_staging }}"

- name: Record whether the client code changed
  ansible.builtin.set_fact:
    suifleet_code_changed: "{{ suifleet_deb_staged is changed or suifleet_package is changed }}"
