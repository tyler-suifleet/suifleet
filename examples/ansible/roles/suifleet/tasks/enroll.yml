---
# Claim enrollment (docs/ENROLLMENT.md): the device key sends, the single-use
# claim key sponsors gas. /etc/suifleet/enrollment.json records the result
# (public IDs only) and makes this step run once per device. Operators never
# handle device addresses: the dApp binds each enrolled claim to its serial.

# Erase the role's claim copies left by an interrupted run before any
# enrollment check, so a refusal below (a configured host without a record,
# an unverifiable partial receipt, a missing batch) cannot leave them behind.
# A run interrupted after the record was renamed into place, but before the
# enrollment block's own cleanup, leaves the staged claim. A recorded host
# erases it here: no play enrolls a recorded host (the record is renamed into
# place after the enrollment command ends), so nothing still needs the copies.
- name: Erase claim copies left on an enrolled host
  ansible.builtin.import_tasks: claim_cleanup.yml
  when: suifleet_enrollment_record.stat.exists

- name: Enroll hosts without an enrollment record
  when: not suifleet_enrollment_record.stat.exists
  vars:
    batch: "{{ suifleet_enrollment_root }}/enrollment/{{ suifleet_serial }}"
  block:
    # One play at a time enrolls a host. Every step from the cleanup of an
    # interrupted run's claim copies to the receipt's promotion runs under this
    # lock, so two overlapping plays never share the staging directory, the
    # transfer directories or the attempt marker, and never both submit. mkdir
    # creates it atomically, holding this run's token; only this run removes
    # it. It lives on /run (tmpfs), so a reboot clears a lock that a killed run
    # left behind. Check mode only looks for it.
    - name: Start without the host's enrollment lock
      ansible.builtin.set_fact:
        suifleet_enroll_locked: false
        suifleet_enroll_lock_token: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_lowercase', 'digits'], length=32) }}"

    - name: Take the host's enrollment lock
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - umask 077; mkdir "$1" || exit 3; printf '%s\n' "$2" > "$1/owner" || { rm -rf "$1"; exit 1; }
          - sh
          - "{{ suifleet_enroll_lock }}"
          - "{{ suifleet_enroll_lock_token }}"
      register: suifleet_enroll_lock_taken
      changed_when: suifleet_enroll_lock_taken.rc == 0
      failed_when: suifleet_enroll_lock_taken.rc not in [0, 3]
      when: not ansible_check_mode

    - name: Record that this run holds the enrollment lock
      ansible.builtin.set_fact:
        suifleet_enroll_locked: "{{ suifleet_enroll_lock_taken.rc == 0 }}"
      when: not ansible_check_mode

    - name: Look for another run's enrollment lock
      ansible.builtin.stat:
        path: "{{ suifleet_enroll_lock }}"
        get_checksum: false
      register: suifleet_enroll_lock_seen
      when: ansible_check_mode

    - name: Stop while another run holds the enrollment lock
      ansible.builtin.assert:
        that: suifleet_enroll_locked | bool or (ansible_check_mode and not suifleet_enroll_lock_seen.stat.exists)
        quiet: true
        fail_msg: >-
          {{ inventory_hostname }} has the enrollment lock {{ suifleet_enroll_lock }}:
          another play is enrolling it, or a play stopped while enrolling it. This
          run changed nothing. Wait for the other play. If none is running (no
          ansible-playbook targets the host and no suifleet --enroll process runs
          on it), remove the lock as root and run again (docs/ANSIBLE.md#recovery).

    # Another play may have enrolled the host after this play first read it.
    - name: Read the enrollment record under the lock
      ansible.builtin.stat:
        path: /etc/suifleet/enrollment.json
        get_checksum: false
      register: suifleet_enrollment_record_locked

    - name: Enroll unless another play enrolled the host first
      when: not suifleet_enrollment_record_locked.stat.exists
      block:
        - name: Erase claim copies left by an interrupted run
          ansible.builtin.import_tasks: claim_cleanup.yml

        - name: Refuse a host that is configured but has no enrollment record
          ansible.builtin.stat:
            path: /etc/suifleet/config.toml
          register: suifleet_unrecorded_config

        - name: Stop before enrolling a configured device again
          ansible.builtin.assert:
            that: not suifleet_unrecorded_config.stat.exists
            quiet: true
            fail_msg: >-
              {{ inventory_hostname }} has /etc/suifleet/config.toml but no
              /etc/suifleet/enrollment.json. It is already enrolled or was configured
              by hand. Restore the record with suifleet --find-enrollment (docs/ANSIBLE.md#recovery);
              never issue it a new claim.

        # The enrollment command prints its receipt only after the transaction
        # succeeded, and the claim is then spent on chain (one use). The partial
        # file is created, and flushed to disk, before the command starts, so it
        # marks every attempt. A run stopped before the receipt was renamed into
        # place leaves it: never submit again or overwrite it. Promote a receipt
        # for this device's key; stop on any other output for manual recovery.
        # Each attempt also records, in the deployment file beside it, the
        # SHA-256 of the manifest it enrolled under: a receipt is promoted only
        # beside that same manifest (the same key can enroll under another
        # deployment, and configure.yml installs suifleet_manifest_src).
        - name: Look for the output of an interrupted enrollment
          ansible.builtin.stat:
            path: /etc/suifleet/.enrollment.json.partial
            get_checksum: false
          register: suifleet_enrollment_partial

        # An empty file means the attempt printed nothing. The command prints only
        # after its transaction committed and was processed, so the response may
        # have been lost (or the host stopped) after the chain committed: the
        # outcome is unknown, and only the chain can settle it. A read-only
        # lookup (no claim, nothing submitted) finds this key's enrollment under
        # the batch's policy and prints the same receipt, which the checks below
        # verify and promote. Finding none settles nothing: the node's history
        # may be pruned, and an attempt still pending may commit later.
        - name: Look up an attempt that printed no receipt on chain
          when:
            - suifleet_enrollment_partial.stat.exists
            - suifleet_enrollment_partial.stat.size == 0
          block:
            - name: Require the batch folder for the lookup
              ansible.builtin.assert:
                that:
                  - suifleet_enrollment_root | length > 0
                  - suifleet_serial is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$')
                quiet: true
                fail_msg: >-
                  {{ inventory_hostname }} has an empty /etc/suifleet/.enrollment.json.partial:
                  an earlier enrollment attempt printed no receipt. Set
                  suifleet_enrollment_root and suifleet_serial so the role can look its
                  enrollment up on chain (enroll.toml and deployment.json; the claim is
                  not used), or settle it as in docs/ANSIBLE.md#recovery.

            # The lookup reads the batch's deployment.json; the record it
            # restores is installed beside suifleet_manifest_src. Refuse a
            # stale or misselected batch before anything runs on the host
            # (check mode too).
            - name: Check the batch folder against the configured deployment
              ansible.builtin.import_tasks: check_batch.yml
              vars:
                suifleet_batch_claim: false

            - name: Report the pending on-chain lookup
              ansible.builtin.debug:
                msg: >-
                  Would look up {{ inventory_hostname }}'s enrollment on chain, after an
                  attempt that printed no receipt, and restore the record if it enrolled.
              changed_when: true
              when: ansible_check_mode

            - name: Look up the device's enrollment
              when: not ansible_check_mode
              block:
                - name: Create the lookup directory
                  ansible.builtin.file:
                    path: "{{ suifleet_enroll_staging }}"
                    state: directory
                    owner: "{{ suifleet_key.stat.pw_name }}"
                    group: "{{ suifleet_key.stat.gr_name }}"
                    mode: "0700"

                # check_batch.yml validated both: the canonical configuration
                # built from enroll.toml's parsed values, and the inventory
                # manifest (identical to the batch's deployment.json).
                - name: Stage the enrollment configuration and manifest for the lookup
                  ansible.builtin.copy:
                    content: "{{ item.content | default(omit) }}"
                    src: "{{ item.src | default(omit) }}"
                    dest: "{{ suifleet_enroll_staging }}/{{ item.dest }}"
                    owner: "{{ suifleet_key.stat.pw_name }}"
                    group: "{{ suifleet_key.stat.gr_name }}"
                    mode: "0600"
                  loop:
                    - {dest: enroll.toml, content: "{{ suifleet_enroll_toml }}"}
                    - {dest: deployment.json, src: "{{ suifleet_manifest_src }}"}
                  loop_control:
                    label: "{{ item.dest }}"

                - name: Check the staged manifest against the controller digest
                  ansible.builtin.include_tasks: verify_manifest.yml
                  vars:
                    staged: "{{ suifleet_enroll_staging }}/deployment.json"

                # Read-only: the current key holder signs nothing and the claim
                # file is never read. Exit 3: no enrollment in retained history.
                - name: Find this key's enrollment on chain
                  ansible.builtin.command:
                    argv:
                      - runuser
                      - -u
                      - "{{ suifleet_key.stat.pw_name }}"
                      - --
                      - /usr/bin/suifleet
                      - --find-enrollment
                      - "{{ suifleet_enroll_staging }}/enroll.toml"
                  register: suifleet_enrollment_lookup
                  changed_when: false
                  failed_when: false
              always:
                - name: Erase the lookup directory
                  ansible.builtin.file:
                    path: "{{ suifleet_enroll_staging }}"
                    state: absent

            - name: Stop on an enrollment attempt with an unknown outcome
              ansible.builtin.assert:
                that: suifleet_enrollment_lookup.rc == 0
                quiet: true
                fail_msg: >-
                  {{ inventory_hostname }} has an empty /etc/suifleet/.enrollment.json.partial:
                  an earlier enrollment attempt printed no receipt, and it may still enroll
                  the device on chain. The on-chain lookup found no enrollment for this
                  device's key ({{ suifleet_enrollment_lookup.stderr | default('') | trim }}).
                  The role will not stage a claim or submit again. Settle it on chain
                  (docs/ANSIBLE.md#recovery): revoke the claim, and remove the file only
                  after the revocation succeeded. An unused label on the Enrollment page
                  alone is not enough: the attempt may still commit.
              when: not ansible_check_mode

            # The checks below verify it like any receipt; the file stays the
            # attempt marker until the record is promoted. The lookup ran
            # under the verified suifleet_manifest_src, so the receipt is
            # bound to it; the binding is written first.
            - name: Bind the receipt the lookup found to the configured deployment
              ansible.builtin.copy:
                content: "{{ suifleet_manifest.stat.checksum }}\n"
                dest: "{{ suifleet_enrollment_deployment }}"
                owner: root
                group: root
                mode: "0600"
              when: not ansible_check_mode

            - name: Keep the receipt the lookup found in the attempt marker
              ansible.builtin.copy:
                content: "{{ suifleet_enrollment_lookup.stdout }}\n"
                dest: /etc/suifleet/.enrollment.json.partial
                owner: root
                group: root
                mode: "0600"
              when: not ansible_check_mode

        - name: Recover the record from an interrupted enrollment
          when:
            - suifleet_enrollment_partial.stat.exists
            - not (ansible_check_mode and suifleet_enrollment_partial.stat.size == 0)
          block:
            - name: Read the interrupted enrollment output
              ansible.builtin.slurp:
                src: /etc/suifleet/.enrollment.json.partial
              register: suifleet_enrollment_partial_file

            - name: Stop unless the output is this device's enrollment receipt
              vars:
                receipt_text: "{{ suifleet_enrollment_partial_file.content | b64decode }}"
                receipt: "{{ receipt_text | from_json }}"
              ansible.builtin.assert:
                that:
                  - receipt_text is match('^\\{[^\\n]*\\}\\n?$')
                  - receipt_text is search('"device_cap_id":"0x[0-9a-f]{64}"')
                  - receipt is mapping
                  - receipt.device_address | default('') == suifleet_device_address
                  - receipt.device_object_id | default('') is match('^0x[0-9a-f]{64}$')
                  - receipt.device_cap_id | default('') is match('^0x[0-9a-f]{64}$')
                  - receipt.owner_cap_id | default('') is match('^0x[0-9a-f]{64}$')
                  - receipt.digest | default('') is match('^[1-9A-HJ-NP-Za-km-z]{32,44}$')
                quiet: true
                fail_msg: >-
                  {{ inventory_hostname }} has /etc/suifleet/.enrollment.json.partial
                  from an earlier enrollment attempt, but it is not a complete receipt
                  for this device's key. That enrollment may already have used the
                  claim on chain, so the role will not submit again or overwrite the
                  file. Restore the record from suifleet --find-enrollment
                  (docs/ANSIBLE.md#recovery); never issue it a new claim.

            # Shape and key above; the deployment here. A receipt from an
            # attempt under another deployment (the inventory manifest changed
            # since), or without a recorded deployment, is kept and stops the
            # run before any record or configuration is written.
            - name: Read the deployment the interrupted attempt enrolled under
              ansible.builtin.slurp:
                src: "{{ suifleet_enrollment_deployment }}"
              register: suifleet_enrollment_attempt_deployment
              failed_when: false

            - name: Stop unless the receipt is bound to the configured deployment
              ansible.builtin.assert:
                that:
                  - suifleet_enrollment_attempt_deployment.content is defined
                  - >-
                    (suifleet_enrollment_attempt_deployment.content | b64decode)
                    == suifleet_manifest.stat.checksum ~ '\n'
                quiet: true
                fail_msg: >-
                  {{ inventory_hostname }} has an enrollment receipt in
                  /etc/suifleet/.enrollment.json.partial from an attempt that did not
                  run under the configured deployment ({{ suifleet_manifest_src }},
                  SHA-256 {{ suifleet_manifest.stat.checksum }}), or whose deployment
                  is not recorded in {{ suifleet_enrollment_deployment }}. The role
                  keeps the receipt and writes no record or configuration. Select the
                  deployment the device enrolled under, or restore the record under
                  this deployment with suifleet --find-enrollment (docs/ANSIBLE.md#recovery).

            - name: Report the pending record recovery
              ansible.builtin.debug:
                msg: "Would restore {{ inventory_hostname }}'s enrollment record from its interrupted enrollment's receipt."
              changed_when: true
              when: ansible_check_mode

            - name: Promote the interrupted enrollment's receipt
              ansible.builtin.shell: |
                set -eu
                partial=/etc/suifleet/.enrollment.json.partial
                chown root:suifleet "$partial"
                chmod 0640 "$partial"
                mv -f "$partial" /etc/suifleet/enrollment.json
                rm -f "$DEPLOYMENT"
              args:
                creates: /etc/suifleet/enrollment.json
              environment:
                DEPLOYMENT: "{{ suifleet_enrollment_deployment }}"

        - name: Enroll with a claim from the batch
          when: not suifleet_enrollment_partial.stat.exists
          block:
            - name: Require the enrollment batch and serial
              ansible.builtin.assert:
                that:
                  - suifleet_enrollment_root | length > 0
                  - suifleet_serial is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$')
                quiet: true
                fail_msg: >-
                  {{ inventory_hostname }} is not enrolled: set suifleet_enrollment_root and
                  a valid suifleet_serial matching its folder in the credential batch.

            - name: Check the batch folder against the configured deployment
              ansible.builtin.import_tasks: check_batch.yml
              vars:
                suifleet_batch_claim: true

            - name: Read the staging filesystem type
              ansible.builtin.command:
                argv: [stat, -f, -c, "%T", "{{ suifleet_enroll_staging | dirname }}"]
              register: suifleet_staging_fs
              changed_when: false
              check_mode: false

            - name: Require memory-backed claim staging
              ansible.builtin.assert:
                that: suifleet_staging_fs.stdout == 'tmpfs'
                quiet: true
                fail_msg: "{{ suifleet_enroll_staging | dirname }} must be a tmpfs so the claim never reaches persistent storage on the host."

            - name: Report the pending enrollment
              ansible.builtin.debug:
                msg: "Would enroll {{ inventory_hostname }} with the claim for serial {{ suifleet_serial }}."
              changed_when: true
              when: ansible_check_mode

            - name: Enroll with the device's own key
              when: not ansible_check_mode
              block:
                # The current key holder (the daemon user before signer.toml exists)
                # runs the enrollment, not root.
                - name: Stage the single-use claim key in memory-backed storage
                  ansible.builtin.import_tasks: stage_claim.yml
                  vars:
                    suifleet_claim_file: "{{ batch }}/claim.key"
                    suifleet_claim_owner: "{{ suifleet_key.stat.pw_name }}"
                    suifleet_claim_group: "{{ suifleet_key.stat.gr_name }}"

                # check_batch.yml validated both: the canonical configuration
                # built from enroll.toml's parsed values, and the inventory
                # manifest (identical to the batch's deployment.json).
                - name: Stage the enrollment configuration and manifest
                  ansible.builtin.copy:
                    content: "{{ item.content | default(omit) }}"
                    src: "{{ item.src | default(omit) }}"
                    dest: "{{ suifleet_enroll_staging }}/{{ item.dest }}"
                    owner: "{{ suifleet_key.stat.pw_name }}"
                    group: "{{ suifleet_key.stat.gr_name }}"
                    mode: "0600"
                  loop:
                    - {dest: enroll.toml, content: "{{ suifleet_enroll_toml }}"}
                    - {dest: deployment.json, src: "{{ suifleet_manifest_src }}"}
                  loop_control:
                    label: "{{ item.dest }}"

                - name: Check the staged manifest against the controller digest
                  ansible.builtin.include_tasks: verify_manifest.yml
                  vars:
                    staged: "{{ suifleet_enroll_staging }}/deployment.json"

                - name: Enroll and record the public IDs
                  ansible.builtin.shell: |
                    set -eu
                    umask 077
                    partial=/etc/suifleet/.enrollment.json.partial
                    # Create the attempt marker exclusively (noclobber opens it with
                    # O_EXCL), so it is never the file of an earlier attempt: that file
                    # marks an attempt that may have spent the claim, and may hold the
                    # only local copy of its receipt. (Ansible splits the arguments of
                    # this script, so its comments keep single quotes paired.)
                    set -C
                    if ! true > "$partial"; then
                      echo "$partial exists; refusing to enroll again (docs/ANSIBLE.md#recovery)" >&2
                      exit 1
                    fi
                    set +C
                    # Record the attempt, and the manifest it enrolls under (staged
                    # and verified above), durably before anything can be submitted,
                    # so a retry after a lost response or power loss never submits
                    # again and promotes its receipt only beside that manifest.
                    # Nothing was sent if this fails, so both are removed.
                    if ! { printf '%s\n' "$MANIFEST_SHA256" > "$DEPLOYMENT" && sync -f "$DEPLOYMENT" "$partial"; }; then
                      rm -f "$partial" "$DEPLOYMENT"
                      echo "could not record $partial; nothing was sent" >&2
                      exit 1
                    fi
                    # The command appends to the empty marker created above, which is
                    # never truncated. A core dump size limit of 0, set after the PAM
                    # limits of runuser apply, keeps a crash of the claim holder from
                    # being stored.
                    runuser -u "$HOLDER" -- sh -c 'ulimit -c 0 && exec /usr/bin/suifleet --enroll "$1"' sh "$STAGING/enroll.toml" >> "$partial"
                    grep -Eq '"device_cap_id":"0x[0-9a-f]{64}"' "$partial"
                    chown root:suifleet "$partial"
                    chmod 0640 "$partial"
                    mv -f "$partial" /etc/suifleet/enrollment.json
                    rm -f "$DEPLOYMENT"
                  args:
                    creates: /etc/suifleet/enrollment.json
                  environment:
                    HOLDER: "{{ suifleet_key.stat.pw_name }}"
                    STAGING: "{{ suifleet_enroll_staging }}"
                    DEPLOYMENT: "{{ suifleet_enrollment_deployment }}"
                    MANIFEST_SHA256: "{{ suifleet_manifest.stat.checksum }}"
              always:
                - name: Erase the staged claim
                  ansible.builtin.file:
                    path: "{{ suifleet_enroll_staging }}"
                    state: absent
  always:
    - name: Release the host's enrollment lock
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - test "$(cat "$1/owner")" = "$2" && rm -rf "$1"
          - sh
          - "{{ suifleet_enroll_lock }}"
          - "{{ suifleet_enroll_lock_token }}"
      changed_when: true
      when: suifleet_enroll_locked | default(false) | bool

- name: Read the enrollment record
  ansible.builtin.slurp:
    src: /etc/suifleet/enrollment.json
  register: suifleet_enrollment_file
  when: not ansible_check_mode or suifleet_enrollment_record.stat.exists

- name: Parse the enrollment record
  ansible.builtin.set_fact:
    suifleet_enrollment: "{{ suifleet_enrollment_file.content | b64decode | from_json }}"
  when: suifleet_enrollment_file is not skipped

- name: Refuse a record for a different identity
  ansible.builtin.assert:
    that:
      - suifleet_enrollment.device_address == suifleet_device_address
      - suifleet_enrollment.device_object_id is match('^0x[0-9a-f]{64}$')
      - suifleet_enrollment.device_cap_id is match('^0x[0-9a-f]{64}$')
    quiet: true
    fail_msg: >-
      /etc/suifleet/enrollment.json does not belong to this device's key. Do not
      replace device.key or copy records between hosts.
  when: suifleet_enrollment is defined
