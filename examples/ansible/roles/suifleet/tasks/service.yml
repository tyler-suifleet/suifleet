---
# suifleet.service is not enabled itself: suifleet-enrollment.path starts it
# whenever /etc/suifleet/config.toml exists, including at boot. SuiFleet never
# reboots the host; reboot and firmware decisions stay with the platform.
#
# Restarts follow this run's changes and also any running process that still
# uses replaced inputs, so a rollout interrupted after its files landed but
# before the restarts converges on the next run.
- name: Start services on enrolled devices
  when: suifleet_enrollment is defined
  block:
    - name: Find running services that predate their installed inputs
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "{{ lookup('ansible.builtin.file', 'running_inputs.py') }}"
          - "suifleet-signer.service={{ suifleet_signer_inputs | join(',') }}"
          - "suifleet.service={{ suifleet_daemon_inputs | join(',') }}"
      register: suifleet_running_before
      changed_when: false
      check_mode: false

    - name: Decide which services to restart
      vars:
        signer_inputs_changed: >-
          {{ (suifleet_code_changed | default(false) | bool)
             or suifleet_manifest_file is changed or suifleet_signer_file is changed }}
      ansible.builtin.set_fact:
        suifleet_running: "{{ suifleet_running_before.stdout | from_json }}"
        suifleet_restart_signer: >-
          {{ signer_inputs_changed | bool
             or (suifleet_running_before.stdout | from_json)['suifleet-signer.service'].stale }}
        suifleet_restart_daemon: >-
          {{ signer_inputs_changed | bool or suifleet_config_file is changed
             or (suifleet_running_before.stdout | from_json) | dict2items
                | selectattr('value.stale') | list | length > 0 }}

    - name: Report services still running replaced inputs
      ansible.builtin.debug:
        msg: "{{ item.key }} will restart: {{ item.value.reason }}."
      loop: "{{ suifleet_running | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.value.stale

    - name: Load unit changes before restarting
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: suifleet_restart_signer | bool or suifleet_restart_daemon | bool

    - name: Enable and start the signing socket and the configuration trigger
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: [suifleet-signer.socket, suifleet-enrollment.path]

    - name: Restart the signing service after code, manifest or signer changes
      ansible.builtin.systemd_service:
        name: suifleet-signer.service
        state: restarted
      when: suifleet_restart_signer | bool

    - name: Restart the daemon after code or configuration changes
      ansible.builtin.systemd_service:
        name: suifleet.service
        state: restarted
      when: suifleet_restart_daemon | bool

    - name: Keep the daemon running
      ansible.builtin.systemd_service:
        name: suifleet.service
        state: started
      when: not suifleet_restart_daemon | bool
