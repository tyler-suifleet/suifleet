---
# SuiFleet device client role (SF-304). See docs/ANSIBLE.md for every input.

# Packaging/init profile:
#   auto           - deb on Debian 12 / Ubuntu 24.04, otherwise systemd-binary
#                    when suifleet_binary_src is set
#   deb            - local-file Debian package (docs/DEBIAN_PACKAGING.md)
#   systemd-binary - the release binary plus the meta-suifleet units, for other
#                    systemd distributions (docs/INSTALL_DEVICE_CLIENT.md#generic-linux)
# Hosts without systemd are refused; the isolated signer needs systemd socket
# activation and Linux 6.5+ (SO_PEERPIDFD). Yocto targets use the image recipe.
suifleet_profile: auto

# Package artifacts on the controller, taken from a release bundle you have
# already verified with `suifleet --verify-release` (docs/RELEASES.md). The
# SHA-256 values come from that verified release.json, never from the same
# download location as the file.
suifleet_deb_src: ""
suifleet_deb_sha256: ""
suifleet_binary_src: ""
suifleet_binary_sha256: ""
# systemd-binary only: the reviewed meta-suifleet files directory on the
# controller (suifleet-edge/meta-suifleet/recipes-edge/suifleet/files).
suifleet_units_src: ""

# Debian 12 and Ubuntu 24.04 are the tested deb distributions. Each entry
# must equal the host's full release (ansible_facts.distribution_version) or
# its major release (distribution_major_version): Debian point releases are
# 12.x, while Ubuntu "24.04" excludes 24.10 and other non-LTS releases.
suifleet_deb_distributions:
  Debian: ["12"]
  Ubuntu: ["24.04"]
suifleet_allow_untested_distribution: false

# Network manifest on the controller (console "Download connection settings"
# or a publisher's deployments/ENV/current/deployment.json).
suifleet_manifest_src: ""

# Enrollment batch on the controller: the extracted dApp credential archive or
# `scripts/claims.py generate --roster ... --policy ... --manifest ...` output.
# Each host needs suifleet_serial; its folder is
# {{ suifleet_enrollment_root }}/enrollment/{{ suifleet_serial }}/ with
# claim.key, enroll.toml and deployment.json. Hosts that are already enrolled
# never read it, so delete the batch after enrollment.
suifleet_enrollment_root: ""
suifleet_serial: ""
# Private, memory-backed staging directory for the claim during enrollment.
suifleet_enroll_staging: /run/suifleet-enroll

# Daemon configuration (config.toml). The defaults deliver nothing: replace
# /usr/bin/false with your platform's reviewed installer (docs/PLATFORM_INSTALLERS.md).
suifleet_apply_command: /usr/bin/false
suifleet_apply_timeout_seconds: 600
suifleet_apply_allow_recipe_commands: false
suifleet_apply_mode: direct
suifleet_poll_seconds: 10
suifleet_replay_history: false
# Additional reviewed TOML appended to config.toml / signer.toml. Each block
# must begin with its own [table] header. Never put secrets here: use file
# paths that the device provisions itself.
suifleet_config_extra: ""
suifleet_signer_extra: ""

# Post-start health: the daemon must be active and its journal initialized.
suifleet_health_retries: 30
suifleet_health_delay: 2

# Files each service reads at startup. A running service whose process
# predates any of them (or whose executable or unit was replaced) is
# restarted, including after an interrupted earlier run.
suifleet_signer_inputs:
  - /etc/suifleet/deployment.json
  - /etc/suifleet/signer.toml
suifleet_daemon_inputs:
  - /etc/suifleet/deployment.json
  - /etc/suifleet/signer.toml
  - /etc/suifleet/config.toml
