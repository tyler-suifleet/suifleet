# SuiFleet Ansible examples (SF-304). Run from this directory.
[defaults]
roles_path = ./roles
# No log_path: task results stay on the terminal only. Do not add a
# controller log file; secret-bearing tasks also set no_log.
display_args_to_stdout = False
retry_files_enabled = False
host_key_checking = True
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
# Required: enrollment refuses to send a claim unless modules are pipelined,
# so the claim never reaches a file in the remote temporary directory.
pipelining = True
