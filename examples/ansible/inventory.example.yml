---
# Example inventory (SF-304). Copy it outside source control and replace the
# values. It holds no secrets and no device addresses: each host names only
# its serial in the enrollment batch.
suifleet_devices:
  vars:
    # Connect as an unprivileged account with sudo; never as root over SSH.
    ansible_user: deploy
    # Artifacts from a release bundle verified with `suifleet --verify-release`;
    # copy the SHA-256 values from that verified release.json.
    suifleet_deb_src: /srv/suifleet/release-0.2.3/suifleet_0.2.3-1+gitCOMMIT_amd64.deb
    suifleet_deb_sha256: "<64-hex SHA-256 from the verified release.json>"
    # The fleet's network manifest.
    suifleet_manifest_src: /srv/suifleet/deployments/testnet/deployment.json
    # Extracted credential batch (dApp Enrollment download or claims.py). Keep it
    # on encrypted controller storage, or vault-encrypt each claim.key, and
    # delete it once every host is enrolled.
    suifleet_enrollment_root: /secure/suifleet/batch-07
    # Replace /usr/bin/false with your platform's reviewed installer.
    suifleet_apply_command: /usr/bin/false
  children:
    debian_amd64:
      hosts:
        line-01.example.internal: {suifleet_serial: SN-0001}
        line-02.example.internal: {suifleet_serial: SN-0002}
    other_systemd:
      vars:
        # A distribution without the tested Debian package.
        suifleet_profile: systemd-binary
        suifleet_binary_src: /srv/suifleet/release-0.2.3/suifleet/bin/suifleet
        suifleet_binary_sha256: "<64-hex SHA-256 of the verified tarball's binary>"
        suifleet_units_src: /srv/suifleet/source/suifleet-edge/meta-suifleet/recipes-edge/suifleet/files
      hosts:
        gateway-07.example.internal: {suifleet_serial: SN-0107}
