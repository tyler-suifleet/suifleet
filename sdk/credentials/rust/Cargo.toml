[package]
name = "suifleet-aws-sdk-acceptance"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.94.0"

[dependencies]
aws-config = { version = "=1.8.18", default-features = false, features = ["rt-tokio", "default-https-client", "credentials-process"] }
aws-credential-types = "=1.2.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
