name: Move security

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'scripts/check_move_security.py'
      - '.github/workflows/move-security.yml'
      - 'Dockerfile'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'scripts/check_move_security.py'
      - '.github/workflows/move-security.yml'
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: move-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-lints-regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          tags: suifleet-move-security:ci
          cache-from: type=gha,scope=move-security
          cache-to: type=gha,scope=move-security,mode=max
      - name: Restore pinned framework sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ci-move-security
          key: move-security-${{ hashFiles('Dockerfile', 'contracts/Move.lock') }}
      - name: Compiler, Sui linters, tests and deliberately failing controls
        run: |
          mkdir -p .ci-move-security
          docker run --rm --user "$(id -u):$(id -g)" -e CARGO_BUILD_JOBS=2 \
            -v "$PWD:/workspace:ro" -w /workspace \
            -v "$PWD/.ci-move-security:/home/dev/.move" \
            suifleet-move-security:ci python3 scripts/check_move_security.py
