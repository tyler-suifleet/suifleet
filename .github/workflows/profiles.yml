# Public read-only gRPC checks; no wallet, secrets or write permission.
name: Deployment profiles
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.22.2'
      - name: Install locked frontend dependencies
        run: |
          npm install --global pnpm@11.0.8
          cd dapp
          pnpm install --frozen-lockfile
      - name: Offline profile regression checks
        run: node --test scripts/test_profiles.cjs
      - name: Verify every committed deployment against fresh gRPC chain facts
        run: node scripts/check_profiles.cjs
