# Ordinary PR/branch CI. Runs the locked local suite inside the pinned dev image.
# It uses no secrets, has a read-only token, and never publishes, spends gas or
# touches hardware; live gates are in live-gates.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Offline security gate tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_security_audit.py -v

      - name: Offline PR coordinator tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/pr-coordinator/tests -v

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Runner identity
        id: ids
        run: echo "uid=$(id -u)" >> "$GITHUB_OUTPUT" && echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Build pinned dev image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: suifleet-dev:ci
          build-args: |
            USER_UID=${{ steps.ids.outputs.uid }}
            USER_GID=${{ steps.ids.outputs.gid }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restore dependency caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .ci-cache
            suifleet-edge/target
          key: deps-${{ hashFiles('Dockerfile', 'suifleet-edge/Cargo.lock', 'dapp/pnpm-lock.yaml', 'contracts/Move.lock') }}
          restore-keys: deps-

      - name: make ci
        run: |
          mkdir -p .ci-cache/cargo-registry .ci-cache/cargo-git .ci-cache/pnpm-store .ci-cache/move
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -v "$PWD/.ci-cache/cargo-registry:/home/dev/.cargo/registry" \
            -v "$PWD/.ci-cache/cargo-git:/home/dev/.cargo/git" \
            -v "$PWD/.ci-cache/pnpm-store:/home/dev/.local/share/pnpm/store" \
            -v "$PWD/.ci-cache/move:/home/dev/.move" \
            suifleet-dev:ci make ci

      - name: Scoped AWS credentials with unmodified SDKs and local mTLS
        run: make test-aws-credentials SUIFLEET_DEV_IMAGE=suifleet-dev:ci
      - name: Durable AWS stream exporter protocols
        run: make test-stream-export SUIFLEET_DEV_IMAGE=suifleet-dev:ci

      - name: CloudWatch metrics adapter with local emulator
        run: make test-cloudwatch-metrics SUIFLEET_DEV_IMAGE=suifleet-dev:ci
      - name: Firehose exporter with local SDK emulator and durable daemon streams
        run: make test-firehose SUIFLEET_DEV_IMAGE=suifleet-dev:ci

      - name: Component IPC with distinct Unix peer identities
        run: |
          docker run --rm --network none --user 0:0 -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/workspace" -w /workspace suifleet-dev:ci \
            python3 scripts/test_ipc.py

      - name: First-boot identity and permissions
        shell: bash
        run: sh scripts/test_yocto_first_boot.sh suifleet-dev:ci | tee ci-logs/first-boot.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-logs
          path: ci-logs/
          retention-days: 14
          if-no-files-found: warn

  macos:
    # SF-075: the daemon on a hosted macOS runner, a disposable VM. Unit tests,
    # then the shipped LaunchDaemon (installed as root) and kernel-authenticated
    # IPC across distinct users, against the local simulator. No secrets.
    name: macOS runtime (launchd)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install baseline Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal

      - name: Restore dependency caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            suifleet-edge/target
          key: macos-${{ runner.arch }}-${{ hashFiles('suifleet-edge/Cargo.lock') }}
          restore-keys: macos-${{ runner.arch }}-

      - name: Toolchain and host versions
        env:
          RUSTUP_TOOLCHAIN: 1.94.0
        run: |
          mkdir -p ci-logs
          { sw_vers; uname -a; cargo --version; rustc --version; python3 --version; } | tee ci-logs/macos-versions.txt

      - name: Daemon unit tests
        timeout-minutes: 15
        env:
          RUSTUP_TOOLCHAIN: 1.94.0
        run: |
          set -o pipefail
          cd suifleet-edge && cargo test --locked 2>&1 | tee ../ci-logs/macos-unit.log

      - name: Build daemon and simulator shim
        env:
          RUSTUP_TOOLCHAIN: 1.94.0
        run: cargo build --locked --manifest-path suifleet-edge/Cargo.toml --bins --examples

      - name: LaunchDaemon lifecycle, containment, recovery and secrets
        timeout-minutes: 15
        run: |
          set -o pipefail
          sudo env PYTHONDONTWRITEBYTECODE=1 "$(command -v python3)" scripts/test_supervisor_launchd.py \
            --disposable-host --evidence ci-logs/macos-launchd.json | tee ci-logs/macos-launchd.log

      - name: Component IPC with distinct Unix peer identities
        run: |
          set -o pipefail
          sudo env TMPDIR=/private/tmp PYTHONDONTWRITEBYTECODE=1 "$(command -v python3)" scripts/test_ipc.py | tee ci-logs/macos-ipc.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-logs
          path: ci-logs/
          retention-days: 14
          if-no-files-found: warn

  linux-x86:
    name: 32-bit Linux x86 runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # i686 cross build in the pinned release builder, then the real-daemon
      # simulator suites in the 32-bit i386 runner (docs/LINUX_X86.md).
      - name: 32-bit build and software-runner suites
        run: |
          mkdir -p ci-logs
          make test-linux-x86 RELEASE_IMAGE=suifleet-release:ci LINUX_X86_IMAGE=suifleet-linux-x86:ci \
            LINUX_X86_EVIDENCE=ci-logs/linux-x86.json

      - name: Upload 32-bit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x86-evidence
          path: ci-logs/
          retention-days: 14
          if-no-files-found: warn

  testnet-preflight:
    # Public forks retain the offline suite; this keyless probe uses no environment.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify dedicated public environment with the workflow token
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/testnet_ci.py --probe-environment

  security-dependencies:
    name: Security dependencies, secrets and configuration
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify and install pinned security scanner
        run: python3 scripts/install_security_scanner.py "$RUNNER_TEMP/security-tools/trivy"
      - name: Scan source, lockfiles and deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '{}\n' > "$RUNNER_TEMP/security-empty.yaml"
          "$RUNNER_TEMP/security-tools/trivy" filesystem \
            --config "$RUNNER_TEMP/security-empty.yaml" \
            --secret-config "$RUNNER_TEMP/security-empty.yaml" \
            --ignorefile /dev/null --include-dev-deps \
            --scanners vuln,secret,misconfig \
            --skip-dirs '.git,**/node_modules,**/.next,**/target,.ci-cache' \
            --format json --output "$RUNNER_TEMP/trivy-private.json" --quiet .
          python3 scripts/security_audit.py trivy "$RUNNER_TEMP/trivy-private.json" \
            --output security-reports/dependencies.json
      - name: Publish sanitized findings only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-dependencies
          path: security-reports/dependencies.json
          retention-days: 14
          if-no-files-found: warn

  security-codeql:
    name: Security CodeQL (${{ matrix.language }})
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, rust, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install baseline Rust toolchain
        if: matrix.language == 'rust'
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Initialize security analysis
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        env:
          RUSTUP_TOOLCHAIN: 1.94.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze without publishing source excerpts
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        env:
          RUSTUP_TOOLCHAIN: 1.94.0
        with:
          upload: never
          output: ${{ runner.temp }}/codeql-${{ matrix.language }}
      - name: Enforce security findings threshold
        env:
          REPORT_DIRECTORY: ${{ runner.temp }}/codeql-${{ matrix.language }}
          REPORT_LANGUAGE: ${{ matrix.language }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=("$REPORT_DIRECTORY"/*.sarif)
          if (( ${#reports[@]} == 0 )); then
            echo 'CodeQL produced no SARIF report.' >&2
            exit 2
          fi
          python3 scripts/security_audit.py sarif "${reports[@]}" \
            --output "security-reports/codeql-$REPORT_LANGUAGE.json"
      - name: Publish sanitized findings only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-codeql-${{ matrix.language }}
          path: security-reports/codeql-${{ matrix.language }}.json
          retention-days: 14
          if-no-files-found: warn
